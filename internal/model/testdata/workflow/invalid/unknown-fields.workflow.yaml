# Several unknown fields at different levels: all are reported, sorted by position,
# with a suggestion where a field name is close.
kind: Workflow
apiVersion: runnel/v1
name: typos
descripton: Typo at the top level
settings: &defaults
  timeot: 5m
actions:
  - id: start
    type: core.start
  - id: wait
    type: core.wait
    with: { duration: 1s, anything: goes }   # "with" is checked by the action, not here
    retry:
      attempts: 2
      bakoff: 1s
links:
  - { from: start, to: wait, condition: failure }
layout:
  start: { x: 1, y: 2, z: 3 }
