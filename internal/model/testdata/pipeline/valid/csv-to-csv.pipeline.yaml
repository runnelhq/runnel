# Reads customers, keeps the active ones and writes them again (KONZEPT, chapter 5.2).
kind: Pipeline
apiVersion: runnel/v1
name: active-customers
description: Copies the active customers into a new file
parameters:
  - name: FILE
    required: true
  - name: MIN_SALES
    type: decimal
    default: "0"
transforms:
  - id: read
    type: csv.input
    with:
      path: ${FILE}
      delimiter: ";"
  - id: only-active
    type: core.filter
    copies: 4
    distribution: copy
    with:
      condition: "{{ record.sales > params.MIN_SALES }}"
  - id: write
    type: csv.output
    with:
      path: active.csv
    copies: 1
links:
  - { from: read, to: only-active }
  - { from: only-active, to: write, type: data }
settings:
  bufferSize: 20000
  batchSize: 1000
  strict: false
