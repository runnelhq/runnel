name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly, to catch newly published vulnerabilities

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: make vulncheck

  fuzz:
    name: Fuzz (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Fuzz parser and variables (5 minutes each)
        run: make fuzz FUZZTIME=5m

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  build:
    name: Build
    needs: [lint, vulncheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build and package Windows and Linux binaries (incl. SBOMs)
        run: make package
      - name: Smoke test
        run: ./bin/runnel-linux-amd64 version
      - uses: actions/upload-artifact@v7
        with:
          name: runnel-${{ github.sha }}
          path: dist/
          if-no-files-found: error
