# Example for HTTP requests to a REST API (S10). Check it with:  runnel validate examples/http
kind: Project
apiVersion: runnel/v1
name: http
description: Read the latest release of a GitHub repository and check the answer
variables:
  API_URL: https://api.github.com
# Secrets in plain text (S39a2) so that the example works as it is: ${secret:NAME} reads
# them from here. runnel validate warns about them; for real systems set another
# secretStore (e.g. env) and keep the values out of the project.
secretStore: inline
secrets:
  release-token: example-token
