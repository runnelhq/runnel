# Reads orders from an XML export and writes them to a CSV file (S68a):
#   runnel run examples/pipelines/pipelines/xml-orders.pipeline.yaml
# - "read" reads the elements <Bestellung> of sales/orders.xml as records; the prefix
#   erp: of the namespace is not written (names are compared without namespaces).
# - from: takes a value from an attribute (@nr), a nested element (Kunde/Name) or an
#   attribute of one (Kunde/@id); Betrag gives its text, not its attribute waehrung.
# - Order 1004 has "k. A." as Betrag: it goes over the error link to REJECTED, with the
#   line of the order in _error, instead of stopping the pipeline.
kind: Pipeline
apiVersion: runnel/v1
name: xml-orders
parameters:
  - name: OUTPUT
    description: CSV file to write
    default: out/xml-orders.csv
  - name: REJECTED
    description: CSV file for orders with errors
    default: out/xml-rejected.csv
transforms:
  - id: read
    type: xml.input
    with:
      path: sales/orders.xml
      records: Bestellungen/Bestellung
      fields:
        - { name: Nr, from: "@nr", type: int }
        - { name: Kunde, from: Kunde/Name }
        - { name: KundenNr, from: Kunde/@id }
        - { name: Betrag, type: decimal }
        - { name: Datum, type: date }
        - { name: Bezahlt, type: bool }
  - id: write
    type: csv.output
    with:
      path: ${OUTPUT}
      delimiter: ";"
      fields:
        - { name: Nr }
        - { name: Kunde }
        - { name: KundenNr }
        - { name: Betrag, format: "#.##0,00" }
        - { name: Datum, format: dd.MM.yyyy }
        - { name: Bezahlt }
  - id: rejected
    type: csv.output
    with:
      path: ${REJECTED}
      delimiter: ";"
links:
  - { from: read, to: write }
  - { from: read, to: rejected, type: error }
