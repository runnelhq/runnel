# Passes a file list to a pipeline and uses the records it returns (roadmap S24a). Relative paths refer to the project folder (output in out/); for example:
#   runnel run -v examples/pipelines/workflows/files.workflow.yaml
# - "list" lists the CSV files of data/.
# - "check" gives the list to pipelines/files.pipeline.yaml (rows); the pipeline reads
#   it with core.from-result and returns the large files with core.to-result.
# - "report" uses the returned records: results.check.output.rows.
kind: Workflow
apiVersion: runnel/v1
name: files
parameters:
  - name: MIN_SIZE
    type: integer
    default: "160"
outputs:
  - name: LARGE
    type: integer
    value: "{{ len(results.check.output.rows) }}"
actions:
  - id: start
    type: core.start
  - id: list
    type: file.list
    with:
      folder: data
      pattern: "*.csv"
  - id: check
    type: core.run-pipeline
    with:
      pipeline: pipelines/files.pipeline.yaml
      rows: "{{ results.list.output }}"
      params:
        MIN_SIZE: ${MIN_SIZE}
  - id: report
    type: core.log
    with:
      message: "{{ len(results.list.output) }} file(s), at least ${MIN_SIZE} bytes: {{ join(map(results.check.output.rows, .name), ', ') }}"
links:
  - { from: start, to: list }
  - { from: list, to: check }
  - { from: check, to: report }
