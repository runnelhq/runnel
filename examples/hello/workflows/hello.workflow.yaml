# A small, valid workflow. Check it with:  runnel validate examples/hello
kind: Workflow
apiVersion: runnel/v1
name: hello
description: Greets, waits a moment and reports success or failure.
parameters:
  - name: GREETING
    description: Word to greet with
    enum: [Hello, Hi, Moin]
    default: Hello
outputs:
  - name: MESSAGE
    description: The greeting that was logged
    value: "${GREETING}, ${TARGET}!"
actions:
  - id: start
    type: core.start
  - id: greet
    type: core.log
    with:
      message: "${GREETING}, ${TARGET}! (${STAGE} on ${env:COMPUTERNAME:-this computer}, files in ${OUTBOX})"
  - id: pause
    type: core.wait
    with:
      duration: 1s
  - id: done
    type: core.success
  - id: failed
    type: core.abort
links:
  - { from: start, to: greet }
  - { from: greet, to: pause }
  - { from: pause, to: done }
  - { from: pause, to: failed, when: failure }
layout:
  start:  { x: 40, y: 120 }
  greet:  { x: 280, y: 120 }
  pause:  { x: 520, y: 120 }
  done:   { x: 760, y: 120 }
  failed: { x: 760, y: 260 }
