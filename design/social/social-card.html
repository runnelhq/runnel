<!doctype html>
<!-- Vorlage für Social-/Open-Graph-Bild (1280 × 640). Als PNG exportiert: social-card.png.
     Schriften: Inter und JetBrains Mono müssen installiert oder per @font-face eingebunden sein. -->
<html lang="de"><head><meta charset="utf-8"><title>Runnel Social Card</title>
<style>
  :root { --strom-300:#7CC5EB; --strom-400:#3FA6DD; --strom-600:#0A6DA6; --tiefe-950:#0E151D; --tiefe-400:#8F9DAC; --tiefe-100:#EDF1F5; }
  html,body { margin:0; }
  .card { position:relative; width:1280px; height:640px; overflow:hidden; background:var(--tiefe-950); color:#fff;
          font-family:Inter, "Segoe UI", sans-serif; }
  .flow { position:absolute; inset:0; }
  .content { position:absolute; left:96px; top:80px; width:720px; }
  .logo { display:flex; align-items:center; gap:24px; }
  .logo svg { width:96px; height:96px; }
  .logo span { font-size:72px; font-weight:600; letter-spacing:-0.02em; }
  h1 { margin:48px 0 0; font-size:64px; line-height:1.05; font-weight:700; letter-spacing:-0.025em; }
  h1 em { font-style:normal; color:var(--strom-300); }
  p { margin:24px 0 0; font-size:26px; line-height:1.4; color:var(--tiefe-400); max-width:640px; }
  code { position:absolute; left:96px; bottom:64px; font-family:"JetBrains Mono", Consolas, monospace; font-size:22px; color:var(--tiefe-100);
         background:rgb(255 255 255 / .06); border:1px solid rgb(255 255 255 / .1); border-radius:10px; padding:12px 18px; }
  code b { color:var(--strom-300); font-weight:500; }
</style></head>
<body><div class="card">
  <svg class="flow" viewBox="0 0 1280 640" aria-hidden="true">
    <g fill="none" stroke-linecap="round">
      <path d="M760 -40 C 980 -40 940 300 1160 300 S 1340 260 1400 260" stroke="#0A6DA6" stroke-width="28" opacity=".55"/>
      <path d="M700 120 C 920 120 880 460 1100 460 S 1300 420 1400 420" stroke="#1688C6" stroke-width="18" opacity=".45"/>
      <path d="M840 300 C 1000 300 980 620 1140 620 S 1320 600 1400 600" stroke="#3FA6DD" stroke-width="10" opacity=".35"/>
    </g>
    <circle cx="1160" cy="300" r="34" fill="none" stroke="#7CC5EB" stroke-width="22"/>
  </svg>
  <div class="content">
    <div class="logo">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#0A6DA6"/><circle cx="14.5" cy="22" r="6.5" fill="#fff"/><path d="M25 22C33.5 22 30.5 42 37.5 42" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><circle cx="48.5" cy="42" r="5.25" fill="none" stroke="#7CC5EB" stroke-width="4.75"/></svg>
      <span>runnel</span>
    </div>
    <h1>Leicht. Lokal.<br><em>Im Fluss.</em></h1>
    <p>Workflows und Datenintegration für Windows – eine einzige exe, keine Runtime, keine Datenbank.</p>
  </div>
  <code><b>&gt;</b> runnel run nightly.workflow.yaml</code>
</div></body></html>
