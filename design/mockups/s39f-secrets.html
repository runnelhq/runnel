<!doctype html>
<!--
  Mockup S39f – Secrets in the editor: set, replace and delete values of the local store,
  never show them.
  The secret field (connection form and properties panel) shows only the reference ${secret:…}
  and its state per environment; below it, per environment, what to do: "Set value…" for the
  local store, an explanation for env (Runnel cannot set environment variables), a warning
  for inline (plain text in the project). "Set value" opens a dialog with a masked input.
  The overview of all secrets of the project lives in the "Secrets" section of the
  project.yaml form (E20), with all environments as columns, the uses and the secrets that
  are set but no longer used. The store of the Windows service is only named, never set:
  that needs the console as administrator. With the editor reachable from the network
  (S40b), setting values is off.
  Builds on the approved mockups S39b/S39f (s39-connections.html: secret field, first draft of
  the Secrets tab and the dialog) and E20 (forms for project.yaml and environments).
  Static, design tokens only.

  Query parameters:
    theme = light | dark                                                           (default light)
    state = missing | set | unreadable | dialog | error | overview | network       (default missing)
    controls = 0                                               hides the mockup control bar (screenshots)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>secrets – Runnel</title>
<link rel="icon" href="../logo/favicon.svg" type="image/svg+xml">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--rn-font-sans); font-size: var(--rn-text-sm); line-height: 1.5; color: var(--foreground);

  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6;

  /* Shell (E4) */

  .spacer { flex: 1; }

  .segmented button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 3px 8px;
                      border-radius: var(--rn-radius-sm); font-size: var(--rn-text-xs); color: var(--muted-foreground); cursor: pointer; }

  .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--input);

  .inp { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border: 1px solid var(--input); border-radius: var(--rn-radius-md);

  /* Per environment below the field (new in S39f): what to do where */

        font-size: var(--rn-text-2xs); line-height: 1.5; }
  .er:first-child { border-top: 0; }
  .er .src { font-family: var(--rn-font-mono); color: var(--muted-foreground); padding-top: 2px; }
  .er .txt { padding-top: 2px; }
  .er .txt b { font-weight: 600; }
  .er .txt .muted { color: var(--muted-foreground); }
  .er .acts { display: inline-flex; gap: 6px; }
  .er.hl { background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .envfoot { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--border); font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .envfoot a { margin-left: auto; }
  .w { color: var(--warning); font-weight: 700; }
  .d { color: var(--destructive); font-weight: 700; }

  /* Overview in the project.yaml form (new in S39f) */

  .st td.cell .t { color: var(--muted-foreground); }

  .st tr.detail > td { background: var(--card); padding: 0 8px 10px 8px; }
  .st td.act { width: 30px; text-align: right; color: var(--muted-foreground); }

  .dgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }

  .dcell .h .mono { font-weight: 400; color: var(--muted-foreground); font-size: 10px; margin-left: auto; }
  .dcell p { margin: 0 0 6px; color: var(--muted-foreground); line-height: 1.45; }
  .dcell .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .legend { margin: 8px 0 0; font-size: 10px; color: var(--muted-foreground); line-height: 1.6; }

  /* Notes */
  .info { display: flex; gap: 8px; align-items: flex-start; font-size: var(--rn-text-2xs); color: var(--muted-foreground); background: var(--muted);
          border-radius: var(--rn-radius-md); padding: 8px 10px; margin-top: 10px; line-height: 1.5; }

  .info .cmd { display: flex; align-items: center; gap: 6px; margin-top: 5px; }

            border: 1px solid var(--border); font-size: var(--rn-text-xs); line-height: 1.5; }
  .banner .sym { flex: none; color: var(--muted-foreground); display: inline-flex; padding-top: 1px; }
  .banner .t { font-weight: 600; }
  .banner .m { color: var(--muted-foreground); font-size: var(--rn-text-2xs); margin-top: 2px; }
  .banner code { font-size: 10px; }
  .err { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; padding: 9px 11px; border-radius: var(--rn-radius-md); background: var(--danger-soft);
         font-size: var(--rn-text-2xs); line-height: 1.5; }
  .err .sym { color: var(--destructive); font-weight: 700; }
  .err b { font-weight: 600; }
  .err code { font-size: 10px; background: var(--background); border-radius: var(--rn-radius-sm); padding: 1px 5px; }

  /* Dialog */
  .scrim { position: absolute; inset: 0; background: color-mix(in srgb, var(--rn-tiefe-950) 40%, transparent); display: grid; place-items: center; z-index: 10; }
  .dialog { width: 540px; background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--rn-radius-lg);

  .where > span:nth-child(odd) { color: var(--muted-foreground); }
  .dots { letter-spacing: 2px; }

  .mock-controls { height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
                   font: 12px/1 var(--rn-font-mono); background: var(--rn-tiefe-950); color: var(--rn-tiefe-300); }
  .mock-controls a { color: var(--rn-strom-300); }
  .mock-controls b { color: var(--rn-tiefe-0); }
</style>
</head>
<body>
<div class="mock-controls" id="mock">
  <b>Mockup S39f</b> theme: <a data-theme="light" href="#">light</a> <a data-theme="dark" href="#">dark</a> · state:

<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme") === "dark" ? "dark" : "light";
  const state = params.get("state") || "missing";
  document.documentElement.dataset.theme = theme;
  if (params.get("controls") === "0") document.getElementById("mock").remove();
  else {
    document.getElementById("app").classList.add("with-controls");
    document.querySelectorAll("[data-theme]").forEach(a => a.href = `?theme=${a.dataset.theme}&state=${state}`);
    document.querySelectorAll("[data-state]").forEach(a => a.href = `?theme=${theme}&state=${a.dataset.state}`);
  }
  const icon = (d, size = 16) => `<svg class="i" viewBox="0 0 24 24" style="width:${size}px;height:${size}px">${d}</svg>`;
  const chev = '<svg class="i chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
  const chevRight = '<svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  const I = {
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    wf: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6h3a3 3 0 0 1 3 3v6a3 3 0 0 0 3 3"/>',
    env: '<path d="M4 6h16M4 12h16M4 18h10"/>',
    proj: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
    db: '<ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/>',
    http: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
    smtp: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    srv: '<path d="M4 4h16v6H4zM4 14h16v6H4zM7.5 7h.01M7.5 17h.01M12 10v4"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    plug: '<path d="M9 7V3M15 7V3M6 7h12v4a6 6 0 0 1-12 0zM12 17v4"/>',
    form: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',
    code: '<path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    reload: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    down: '<path d="M6 9l6 6 6-6"/>',
    up: '<path d="M6 15l6-6 6 6"/>',
    copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
    shield: '<path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/>',
    net: '<circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v5M12 12l-6 5M12 12l6 5"/>',
    term: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/>',
  };

  // The project: dev reads secrets from secrets: in environments/dev.yaml (inline), test from
  // environment variables (env), prod from the local store of this computer (local).
  const projectState = state === "overview" || state === "network";
  const file = projectState ? "project.yaml" : "connections/erp-sql.yaml";
  const name = file.split("/").pop();
  const network = state === "network";

  // ---------- Explorer ----------
  document.getElementById("tree-actions").innerHTML =
    `<button class="icon-btn" aria-label="New">${icon(I.plus, 15)}</button><button class="icon-btn" aria-label="Reload explorer">${icon(I.reload, 14)}</button>`;
  const missingCount = state === "set" ? 0 : 2;
  const rows = [["folder", "connections", 0, "4"], ["db", "erp-sql.yaml", 1, "", "sqlserver"], ["http", "crm-api.yaml", 1, "", "http"],
    ["smtp", "mail.yaml", 1, "", "smtp"], ["srv", "partner-sftp.yaml", 1, "", "sftp"],
    ["folder", "environments", 0, "3"], ["env", "dev.yaml", 1], ["env", "test.yaml", 1], ["env", "prod.yaml", 1],
    ["folder", "triggers", 0, "1"], ["folder", "workflows", 0, "3"], ["wf", "import.workflow.yaml", 1], ["wf", "report.workflow.yaml", 1], ["wf", "upload.workflow.yaml", 1],
    ["proj", "project.yaml", 0, "", "", missingCount ? `⚠ ${missingCount}` : ""]];
  document.getElementById("tree").innerHTML = rows.map(([k, n, d, c, t, w]) =>
    `<li><div class="row ${d ? "d1" : ""} ${n === name ? "selected" : ""}">` +
    (k === "folder" ? (n === "triggers" ? chevRight : chev) : `<span style="width:12px"></span>`) +
    `<span class="kind">${icon(I[k])}</span>${n}${c ? `<span class="count">${c}</span>` : ""}${t ? `<span class="tag">${t}</span>` : ""}` +
    `${w ? `<span class="warnc" title="Secrets missing for an environment">${w}</span>` : ""}</div></li>`).join("");

  // ---------- Tabs and file bar ----------
  document.getElementById("tabs").innerHTML = `<div class="tab active">${icon(projectState ? I.proj : I.db)} ${name} ×</div>`;
  const fb = document.getElementById("filebar");
  const formYaml = `<div class="segmented"><button aria-pressed="true">${icon(I.form, 14)}Form</button><button>${icon(I.code, 14)}YAML</button></div>`;
  if (projectState) {
    fb.innerHTML = `<span class="crumbs"><b>${file}</b></span><span class="badge">Project</span><span class="badge warn">⚠ 2</span><div class="spacer"></div>
      <button class="btn" style="opacity:.5">Save <kbd>Ctrl+S</kbd></button>${formYaml}`;
  } else {
    fb.innerHTML = `<span class="crumbs"><b>${file}</b></span><span class="badge">Connection</span>${state === "set" ? "" : '<span class="badge warn">⚠ 2</span>'}<div class="spacer"></div>
      <span style="display:inline-flex"><button class="btn split">${icon(I.plug, 13)}Test connection</button><button class="btn" aria-label="Environment">prod ${icon(I.down, 12)}</button></span>
      <button class="btn" style="opacity:.5">Save <kbd>Ctrl+S</kbd></button>${formYaml}`;
  }

  // ---------- Helpers ----------
  const fld = (label, key, inner, o = {}) => `<div class="fld"><div class="lab">${label}${o.req ? '<span class="req">*</span>' : ""}<span class="key">${key}</span></div>${inner}${o.help ? `<div class="help">${o.help}</div>` : ""}${o.after || ""}</div>`;
  const inp = (v, o = {}) => `<div class="inp ${o.mono ? "mono" : ""} ${o.ph ? "ph" : ""} ${o.cls || ""}">${v}${o.select ? `<span class="caret-d">${icon(I.down, 13)}</span>` : ""}</div>`;
  // State pills: ● set (store), ⚠ missing, ⚠ plain text (inline, red), – cannot be read.
  const pill = (env, s, src, o = {}) => {
    const sign = s === "miss" ? "⚠" : s === "plain" ? "⚠" : s === "na" ? "–" : "●";
    return `<span class="pill ${s} ${o.sel ? "sel" : ""}" title="${env}: ${src}">${sign} ${env}${src ? ` <span class="src">${src}</span>` : ""}</span>`;
  };
  const secretBox = (ref, pills, o = {}) => `<div class="secret ${o.open ? "open" : ""}"><span class="lock">${icon(I.lock, 14)}</span><span class="ref"><i>\${secret:</i>${ref}<i>}</i></span>
      <span class="envs">${pills}</span><button class="btn small" aria-expanded="${o.open ? "true" : "false"}" aria-label="States per environment">${icon(o.open ? I.up : I.down, 12)}</button><button class="btn small">Change…</button></div>`;

  // Rows below the field: one per environment, with what can be done there.
  const rowInline = `<div class="er"><span>${pill("dev", "plain", "")}</span><span class="src">inline</span>
      <span class="txt"><b>Plain text</b> under <span class="mono">secrets:</span> in <a href="#" class="mono">environments/dev.yaml</a> – the value is in the file and in Git. Use it only for development.</span>
      <span class="acts"><button class="btn small">Open dev.yaml</button></span></div>`;
  const rowEnv = (set) => `<div class="er"><span>${pill("test", set ? "" : "miss", "")}</span><span class="src">env</span>
      <span class="txt">${set ? "Read from" : "<b>Not set.</b> Read from"} the environment variable <span class="mono">erp-sql-password</span> of the Runnel process.
      <span class="muted">Runnel cannot set it: set it in Windows for the account that runs Runnel (System properties › Environment variables), then restart Runnel.</span></span>
      <span class="acts"></span></div>`;
  const rowLocal = (kind) => {
    if (kind === "missing") return `<div class="er hl"><span>${pill("prod", "miss", "")}</span><span class="src">local</span>
      <span class="txt"><b>Not set</b> in the local store of this project on this computer. Runs with prod do not start.</span>
      <span class="acts">${network
        ? `<button class="btn small" disabled>${icon(I.key, 12)}Set value…</button>`
        : `<button class="btn small primary">${icon(I.key, 12)}Set value…</button>`}</span></div>`;
    if (kind === "na") return `<div class="er hl"><span>${pill("prod", "na", "")}</span><span class="src">local</span>
      <span class="txt"><b>The local store cannot be read:</b> access to the file of the store was denied. Runs with prod do not start.
      <span class="muted">Details are in the server log; check the permissions of <span class="mono">%LOCALAPPDATA%\\runnel\\secrets</span>.</span></span>
      <span class="acts"><button class="btn small">${icon(I.reload, 12)}Check again</button></span></div>`;
    return `<div class="er hl"><span>${pill("prod", "", "")}</span><span class="src">local</span>
      <span class="txt"><b>Set</b> in the local store on this computer · changed 2 days ago. <span class="muted">The value is never shown.</span></span>
      <span class="acts"><button class="btn small">${icon(I.key, 12)}Replace value…</button><button class="btn small danger">${icon(I.trash, 12)}Delete value</button></span></div>`;
  };
  const envFoot = `<div class="envfoot">${icon(I.shield, 13)}<span>Runs of the Windows service read their own store; it is set in the console as administrator.</span><a href="#">All secrets of the project…</a></div>`;

  // ---------- Views ----------
  const view = document.getElementById("view");
  if (!projectState) {
    const kind = state === "set" ? "set" : state === "unreadable" ? "na" : "missing";
    const pills = pill("dev", "plain", "inline") + pill("test", state === "set" ? "" : "miss", state === "set" ? "env" : "missing") +
      (kind === "set" ? pill("prod", "", "local", { sel: 1 }) : kind === "na" ? pill("prod", "na", "cannot be read") : pill("prod", "miss", "missing", { sel: 1 }));
    const password = fld("Password", "password", secretBox("erp-sql-password", pills, { open: true }) +
      `<div class="envlist">${rowInline}${rowEnv(state === "set")}${rowLocal(kind)}${envFoot}</div>`,
      { help: "Values are stored outside the project; the editor never shows them" });
    view.innerHTML = `<div class="formwrap"><div class="form">
      <div class="conn-head"><span class="tile">${icon(I.db)}</span><div><h2>erp-sql</h2><div class="sub">SQL Server · A Microsoft SQL Server database, with a user or with the Windows account Runnel runs as</div></div></div>
      <p class="lead">ERP database, read only <span class="mono" style="font-size:10px">description</span> · used by 3 steps in <a href="#" class="mono">import.workflow.yaml</a>, <a href="#" class="mono">report.workflow.yaml</a></p>
      <div class="sec"><h3>${chev}Server</h3>
        <div class="grid3">${fld("Host", "host", inp('<span class="v">${ERP_HOST}</span>'), { req: 1 })}
        ${fld("Port", "port", inp("1433 (default)", { ph: 1 }))}
        ${fld("Database", "database", inp("ERP"), { req: 1 })}</div>
      </div>
      <div class="sec"><h3>${chev}Sign-in</h3>
        ${fld("User", "user", inp("runnel_read", { mono: 1 }), { help: "Empty: the Windows account of the Runnel process signs in" })}
        ${password}
      </div>
      <div class="sec"><h3>${chev}Security</h3>
        <div class="fld"><span class="check"><span class="box on">${icon(I.check)}</span>Encrypt the connection <span class="mono" style="color:var(--muted-foreground);font-size:10px">encrypt</span></span></div>
      </div>
      <div class="sec closed"><h3>${chevRight}More<span class="count">instance, trustServerCertificate, connectTimeout</span></h3></div>
    </div></div>`;
    if (state === "dialog" || state === "error") {
      // The field behind the dialog keeps its rows; only "Set value…" was pressed.
    }
  } else {
    // project.yaml form (E20) scrolled to its section "Secrets": the overview of the project.
    const cell = (s, src, extra = "") => {
      if (s === "set") return `<td class="cell"><span class="ok-s">●</span> set <span class="t">${extra}</span></td>`;
      if (s === "miss") return `<td class="cell"><span class="w">⚠</span> missing</td>`;
      if (s === "plain") return `<td class="cell"><span class="d">⚠</span> plain text</td>`;
      return `<td class="cell"><span class="t">–</span> ${src}</td>`;
    };
    const tr = (n, uses, dev, test, prod, o = {}) => `<tr class="${o.open ? "open" : ""} ${o.unused ? "unused" : ""}"><td class="name">${n}<small>${uses}</small></td>${dev}${test}${prod}
      <td class="act">${icon(o.open ? I.up : I.down, 13)}</td></tr>`;
    const setBtn = (label, primary) => network
      ? `<button class="btn small" disabled>${icon(I.key, 12)}${label}</button>`
      : `<button class="btn small ${primary ? "primary" : ""}">${icon(I.key, 12)}${label}</button>`;
    const detail = `<tr class="detail"><td colspan="5">
        <ul class="uses"><li style="color:var(--muted-foreground)">Used in</li><li><a href="#">connections/erp-sql.yaml:11</a> <span style="color:var(--muted-foreground)">password</span></li></ul>
        <div class="dgrid">
          <div class="dcell"><div class="h"><span class="d">⚠</span>dev<span class="mono">inline</span></div><p>Plain text in <span class="mono">environments/dev.yaml</span>. Change it in that file.</p>
            <div class="acts"><button class="btn small">Open dev.yaml</button></div></div>
          <div class="dcell"><div class="h"><span class="w">⚠</span>test<span class="mono">env</span></div><p>Environment variable <span class="mono">erp-sql-password</span> is not set for the Runnel process. Runnel cannot set it; set it in Windows and restart Runnel.</p></div>
          <div class="dcell"><div class="h"><span class="w">⚠</span>prod<span class="mono">local</span></div><p>Not set on this computer. Runs with prod do not start.</p>
            <div class="acts">${setBtn("Set value…", true)}</div></div>
        </div></td></tr>`;
    const banner = network ? `<div class="banner"><span class="sym">${icon(I.net, 16)}</span><div><div class="t">Setting secrets is off while the editor is reachable from the network</div>
        <div class="m">This server listens on <span class="mono">10.0.4.21:7300</span>. Values could be typed in on any computer that reaches it, so the editor only shows
        names and states. Set values in the console of this computer: <code>runnel secret set NAME</code> – or start the server with <code>--allow-secret-changes</code>.</div></div></div>` : "";
    view.innerHTML = `<div class="formwrap" id="fw"><div class="form">
      <div class="conn-head"><span class="tile proj">${icon(I.proj)}</span><div><h2>orders</h2><div class="sub">Project · <span class="mono">C:\\Runnel\\projects\\orders</span></div></div></div>
      <p class="lead">Imports orders from the shop into the ERP <span class="mono" style="font-size:10px">description</span></p>
      <div class="sec closed"><h3>${chevRight}Project<span class="count">name, description, defaultEnvironment</span></h3></div>
      <div class="sec closed"><h3>${chevRight}Variables<span class="count">4</span></h3></div>
      <div class="sec" id="secrets"><h3>${chev}Secrets<span class="count">5</span><span class="right"><span class="badge warn">⚠ 2 missing</span><span class="badge" style="background:var(--danger-soft);color:var(--destructive)">⚠ dev: plain text</span></span></h3>
        ${banner}
        ${fld("Secret store", "secretStore", inp("local – this computer, encrypted, outside the project folder", { select: 1 }), { help: "For all environments that set none · dev: <span class=mono>inline</span> · test: <span class=mono>env</span>" })}
        <div class="filters"><span class="chipf on">All 5</span><span class="chipf"><span class="w">⚠</span>Missing 2</span><span class="chipf"><span class="d">⚠</span>Plain text 4</span><span class="chipf">Not used 1</span></div>
        <table class="st"><thead><tr><th>Secret</th><th>dev<small>inline</small></th><th>test<small>env</small></th><th>prod<small>local · this computer</small></th><th></th></tr></thead><tbody>
          ${tr("erp-sql-password", "1 use", cell("plain"), cell("miss"), cell("miss"), { open: 1 })}${detail}
          ${tr("crm-api-token", "2 uses", cell("plain"), cell("set", "", "variable"), cell("set", "", "2 days ago"))}
          ${tr("smtp-client-secret", "1 use", cell("plain"), cell("set", "", "variable"), cell("set", "", "14 days ago"))}
          ${tr("partner-sftp-key", "1 use · multi-line", cell("plain"), cell("set", "", "variable"), cell("set", "", "3 days ago"))}
          ${tr("old-ftp-password", "not used", `<td class="cell"><span class="t">–</span></td>`, `<td class="cell"><span class="t">–</span></td>`,
            `<td class="cell"><span class="ok-s">●</span> set <span class="t">${network ? "" : '<button class="btn small danger" style="margin-left:6px">Delete value</button>'}</span></td>`, { unused: 1 })}
        </tbody></table>
        <p class="legend"><span class="ok-s">●</span> set · <span class="w">⚠</span> used, but missing – runs with this environment do not start · <span class="d">⚠</span> plain text in the project (inline) · – not used there.
          Values are never shown; “not used” lists values in the local store that no file names any more.</p>
        <div class="info"><span class="sym">i</span><div><b>The Windows service has its own store.</b> Runs of the service (<span class="mono">runnel service</span>) read
          <span class="mono">%ProgramData%\\runnel\\secrets</span>, not this one. The editor runs as you and can neither read nor set it; set the values in a console
          opened as administrator, and check them there:
          <div class="cmd"><code>runnel secret set erp-sql-password --service</code><button class="btn small">${icon(I.copy, 12)}Copy</button>
          <code>runnel secret missing --service</code><button class="btn small">${icon(I.copy, 12)}Copy</button></div></div></div>
      </div>
      <div class="sec closed"><h3>${chevRight}Defaults and limits<span class="count">workflow.defaultJoin, settings.maxConcurrentRuns</span></h3></div>
    </div></div>`;
  }

  // The overview opens scrolled to its section, as "All secrets of the project…" does.
  if (projectState) { const fw = document.getElementById("fw"); fw.scrollTop = document.getElementById("secrets").offsetTop - 12; }

  document.getElementById("status").innerHTML = `<span class="ok">● Connected</span><span class="mono" style="font-size:11px">${network ? "10.0.4.21:7300 · TLS" : "127.0.0.1:7300"}</span>` +
    `${network ? `<span>${icon(I.net, 12)} Reachable from the network · secrets read only</span>` : ""}<span>${projectState ? "Project" : "Connection · sqlserver"}</span><span class="spacer"></span><span>Runnel v0.1.0</span>`;

  // ---------- Dialog: set the value of prod ----------
  const app = document.getElementById("app");
  if (state === "dialog" || state === "error") {
    const err = state === "error";
    app.insertAdjacentHTML("beforeend", `<div class="scrim"><div class="dialog" role="dialog" aria-label="Set value">
      <h2>Set value of <span class="mono">erp-sql-password</span></h2><p class="intro">Used by <span class="mono">connections/erp-sql.yaml</span> (password).</p>
      <div class="where"><span>Environment</span><span><b>prod</b></span>
        <span>Stored in</span><span><span class="mono">local</span> – the store of this project on this computer, for your Windows account; encrypted, outside the project folder</span></div>
      ${fld("Value", "", `<div class="inp ${err ? "" : "focus"} mono"><span class="dots">••••••••••••••••••••••••••</span>${err ? "" : '<span class="caret"></span>'}</div>`,
        { help: "Pasted from the clipboard · 26 characters · multi-line values such as private keys keep their line breaks" })}
      ${err ? `<div class="err" role="alert"><span class="sym">✖</span><div><b>The value was not stored.</b> The local secret store needs a key on this system: set
        <code>RUNNEL_MASTER_KEY</code> to 32 random bytes in base64 (e.g. from <code>openssl rand -base64 32</code>), then restart <code>runnel serve</code>.
        <div style="margin-top:4px;color:var(--muted-foreground)">The value stays in the field until you close the dialog.</div></div></div>`
        : `<div class="info"><span class="sym">i</span><span>After saving, the value is never shown again – not here, not in the log or in results. Runs of other environments do not get it.
        Runs of the Windows service read their own store; set it there as administrator: <span class="mono">runnel secret set erp-sql-password --service</span></span></div>`}
      <div class="foot"><span class="spacer"></span><button class="btn">Cancel</button><button class="btn primary">${err ? "Try again" : "Set value"}</button></div>
    </div></div>`);
  }
</script>
</body>
</html>
