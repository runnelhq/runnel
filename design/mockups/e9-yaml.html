<!doctype html>
<!--
  Mockup E9 – Editing YAML: workflows and pipelines are edited in the YAML view as well:
  highlighting as before (E4), checked while typing (/validate) with the problems at the
  line, one undo history shared with the canvas, and what happens while the text cannot be
  read as a graph. Builds on the approved mockups E4 (YAML view), E5 (state "invalid"),
  E6a (undo, save), E7 (problems) and E8. Static, design tokens only.

  Query parameters:
    theme = light | dark                                        (default light)
    state = edit | problem | syntax | canvas                    (default edit)
    controls = 0                                           hides the mockup control bar (screenshots)
-->
<html lang="en">

<title>hello – Runnel</title>
<link rel="icon" href="../logo/favicon.svg" type="image/svg+xml">

<style>

  * { box-sizing: border-box; }

  /* Shell (as approved in mockup E4) */

  .body { display: grid; grid-template-columns: 248px 1fr; min-height: 0; }
  header { display: flex; align-items: center; gap: var(--rn-space-4); padding: 0 var(--rn-space-4);

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .tab.active { background: var(--background); color: var(--foreground); box-shadow: inset 0 2px 0 var(--primary); margin-bottom: -1px; }
  .filebar { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 16px; border-bottom: 1px solid var(--border); }

           font-size: var(--rn-text-2xs); font-weight: 600; background: var(--secondary); color: var(--secondary-foreground); }
  .badge svg.i { width: 12px; height: 12px; }

  /* Canvas (design/README.md, 6.1 "Canvas-Konventionen") */

    background-image: radial-gradient(circle, var(--canvas-grid) 1px, transparent 1.2px);

  }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  .edge-label {

    font-size: 11px; font-weight: 700; line-height: 1;
  }

  .edge-label.always { color: var(--link-always); }

  .node {
    position: absolute; width: 176px; height: 52px; display: flex; align-items: center; gap: 10px;

  }

  .tile { display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--rn-radius-md);

  .tile.unknown { background: var(--rn-tiefe-300); color: var(--rn-tiefe-800); }

  .node .id { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .type { font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .port { position: absolute; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%;
          background: var(--node); border: 1.5px solid var(--node-border); }
  .port.in { left: -5px; }
  .port.out { right: -5px; }
  .marker { position: absolute; top: -9px; right: -9px; display: grid; place-items: center; width: 20px; height: 20px;

  .marker.err { background: var(--destructive); }
  .marker.warn { background: var(--rn-warnung-600); }

  .popover {

  .problem .sym.warn { color: var(--warning); }

  .controls-panel { position: absolute; left: 16px; bottom: 16px; display: flex; flex-direction: column;
                    background: var(--card); border: 1px solid var(--border); border-radius: var(--rn-radius-md);
                    box-shadow: var(--rn-shadow-sm); overflow: hidden; }

  .blocked { position: absolute; inset: 0; display: grid; place-items: center; }
  .blocked .box { max-width: 440px; text-align: center; background: var(--card); border: 1px solid var(--border);
                  border-radius: var(--rn-radius-xl); padding: 24px 28px; box-shadow: var(--rn-shadow-md); }
  .blocked .symbol { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;

  .blocked h2 { font-size: var(--rn-text-md); margin: 12px 0 4px; }

  /* Creating (E6b) */
  aside.split { display: flex; flex-direction: column; min-height: 0; }

  .palette { margin-top: 8px; border-top: 1px solid var(--sidebar-border); display: flex; flex-direction: column; min-height: 0; }
  .search { display: flex; align-items: center; gap: 6px; margin: 0 12px 8px; height: 28px; padding: 0 8px;

  .items { list-style: none; margin: 0; padding: 0 8px; }

  .field-hint { position: absolute; font-size: var(--rn-text-2xs); color: var(--muted-foreground); background: var(--card); border: 1px solid var(--border);
                border-radius: var(--rn-radius-sm); padding: 2px 6px; white-space: nowrap; box-shadow: var(--rn-shadow-sm); }
  .edge.preview { stroke-dasharray: 6 4; }
  .port.target { width: 14px; height: 14px; margin-top: -7px; left: -8px; border: 2px solid var(--node-selected); background: var(--accent); }
  .port.source { border-color: var(--node-selected); background: var(--node-selected); }
  .edge.selected { stroke-width: 3.5; }
  .edge-label.selected { outline: 2px solid var(--node-selected); outline-offset: 2px; }
  .menu { position: absolute; width: 196px; padding: 4px; background: var(--popover); color: var(--popover-foreground);

  .menu .mi .k { margin-left: auto; font: 10px var(--rn-font-mono); color: var(--muted-foreground); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

  /* Editing (E6a) */
  .tab .dirty { width: 18px; text-align: center; color: var(--foreground); font-size: 10px; }
  .icon-btn { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--input);
              border-radius: var(--rn-radius-md); background: var(--background); color: var(--foreground); }
  .icon-btn[disabled] { color: var(--muted-foreground); opacity: .5; }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .btn kbd { font: 10px var(--rn-font-mono); opacity: .75; }
  .group { display: inline-flex; gap: 4px; }
  footer .dirty { color: var(--foreground); }
  .node { cursor: grab; }
  .node.moved { box-shadow: var(--rn-shadow-md); }

  .dialog h2 { margin: 0 0 8px; font-size: var(--rn-text-md); display: flex; align-items: center; gap: 10px; }

  .dialog p { margin: 0 0 10px; color: var(--muted-foreground); }

  .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    /* Properties (E7) */
  .filebar .crumbs, .filebar .badge { white-space: nowrap; }
  .input { white-space: nowrap; overflow: hidden; }
  .body { grid-template-columns: 248px 1fr 320px; }
  .work { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .list .li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: var(--rn-text-xs); }
  .list .li:last-child { border-bottom: 0; }
  .list .li small { grid-column: 1 / -1; color: var(--muted-foreground); font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); }

  /* Problems panel below the canvas */
  .bottom { flex: none; border-top: 1px solid var(--border); background: var(--background); }
  .bottom .tabs2 { display: flex; align-items: center; height: 32px; padding: 0 8px; gap: 2px; }
  .bottom .tabs2 .t2 { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--rn-radius-sm);
                       font-size: var(--rn-text-xs); color: var(--muted-foreground); }
  .bottom .tabs2 .t2.active { background: var(--muted); color: var(--foreground); font-weight: 500; }
  .bottom .tabs2 .n { display: inline-grid; place-items: center; min-width: 18px; height: 16px; padding: 0 5px; border-radius: var(--rn-radius-full);
                      font-size: 10px; font-weight: 600; background: var(--danger-soft); color: var(--destructive); }
  .bottom .tabs2 .n.warn { background: var(--warning-soft); color: var(--warning); }
  .bottom .tabs2 .collapse { margin-left: auto; color: var(--muted-foreground); }
  .ptable { border-top: 1px solid var(--border); height: 132px; overflow: auto; font-size: var(--rn-text-xs); }
  .prow { display: grid; grid-template-columns: 20px 1fr 150px 90px; align-items: center; gap: 8px; height: 30px; padding: 0 12px;
          border-bottom: 1px solid var(--border); }
  .prow.sel { background: var(--accent); color: var(--accent-foreground); }
  .prow .sym.err { color: var(--destructive); font-weight: 700; }
  .prow .sym.warn { color: var(--warning); font-weight: 700; }
  .prow .where, .prow .line { font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .prow.sel .where, .prow.sel .line { color: inherit; }
  .phead { color: var(--muted-foreground); font-size: var(--rn-text-2xs); height: 24px; background: var(--muted); }
  .field.flash .input { box-shadow: 0 0 0 3px var(--danger-soft); }

  /* Running (E8) */
  .node .runbar { position: absolute; left: 6px; right: 6px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; }
  .runbar.running { background: var(--status-running); }
  .runbar.succeeded { background: var(--status-success); }
  .runbar.failed { background: var(--status-failed); }
  .runbar.waiting { background: var(--status-waiting); }
  .runbar.cancelled { background: var(--status-skipped); }
  .runbar.skipped { height: 0; border-top: 3px dashed var(--status-skipped); }
  .marker.running { background: var(--status-running); }
  .marker.succeeded { background: var(--status-success); }
  .marker.failed { background: var(--status-failed); }
  .marker.waiting { background: var(--status-waiting); }
  .marker.cancelled, .marker.skipped { background: var(--status-skipped); }
  .marker .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent;
                  border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .node.dim { opacity: .55; }
  .node .type .dur { color: var(--foreground); }
  .edge.flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  .edge.dead { opacity: .3; }
  .edge-label.dead { opacity: .45; }
  @media (prefers-reduced-motion: reduce) { .edge.flow, .marker .spin { animation: none; } }

  .splitbtn { display: inline-flex; }
  .splitbtn .btn:first-child { border-radius: var(--rn-radius-md) 0 0 var(--rn-radius-md); }
  .splitbtn .btn:last-child { border-radius: 0 var(--rn-radius-md) var(--rn-radius-md) 0; border-left: 0; padding: 0 6px; }
  .btn .play { color: var(--status-success); }
  .btn.cancel { color: var(--destructive); border-color: var(--destructive); }
  .runchip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--rn-radius-full);
             font-size: var(--rn-text-2xs); font-weight: 600; white-space: nowrap; }
  .runchip.running { background: color-mix(in srgb, var(--status-running) 14%, transparent); color: var(--status-running); }
  .runchip.succeeded { background: color-mix(in srgb, var(--status-success) 14%, transparent); color: var(--status-success); }
  .runchip.cancelled { background: var(--muted); color: var(--muted-foreground); }
  .runchip .spin { width: 9px; height: 9px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
                   animation: spin .9s linear infinite; }

  .logbar { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 12px; border-top: 1px solid var(--border);
            font-size: var(--rn-text-xs); color: var(--muted-foreground); }
  .logbar .mono { font-size: var(--rn-text-2xs); }
  .logbar .spacer { flex: 1; }
  .log { height: 168px; overflow: auto; border-top: 1px solid var(--border); font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); }
  .lrow { display: grid; grid-template-columns: 88px 52px 104px 1fr; gap: 8px; align-items: center; min-height: 24px; padding: 0 12px; }
  .lrow .t { color: var(--muted-foreground); }
  .lrow .lv { font-weight: 600; }
  .lrow .lv.debug { color: var(--muted-foreground); }
  .lrow .lv.info { color: var(--foreground); }
  .lrow .lv.warn { color: var(--warning); }
  .lrow .lv.error { color: var(--destructive); }
  .lrow.error { background: color-mix(in srgb, var(--danger-soft) 70%, transparent); }
  .lrow .a { color: var(--accent-foreground); background: var(--accent); border-radius: var(--rn-radius-sm); padding: 0 5px;
             justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .a.none { background: none; color: var(--muted-foreground); }
  .lrow.sel { outline: 1px solid var(--ring); outline-offset: -1px; }
  .lastrun { margin: 0 16px 10px; padding: 8px 10px; border-radius: var(--rn-radius-md); font-size: var(--rn-text-xs); }
  .lastrun.failed { background: var(--danger-soft); color: var(--destructive); }
  .lastrun small { display: block; color: var(--muted-foreground); font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); }
  .lastrun a { color: inherit; text-decoration: underline; }
  .dialog .field { padding: 0; }
  .dialog h3 { margin: 16px 0 8px; font-size: var(--rn-text-xs); font-weight: 600; }
  .dialog .btn.primary .play { color: inherit; }
  .dialog h2 .sym.run { background: color-mix(in srgb, var(--status-success) 14%, transparent); color: var(--status-success); }

  /* Pipelines (S25a) */
  .filebar { gap: 8px; }
  .tile.cat-input { background: var(--rn-kategorie-eingabe); }
  .tile.cat-transform, .tile.cat-combine { background: var(--rn-kategorie-transformation); }
  .tile.cat-flow { background: var(--rn-kategorie-fluss); }
  .tile.cat-execution { background: var(--rn-kategorie-ausfuehrung); }
  .tile.cat-output { background: var(--rn-kategorie-ausgabe); }
  .edge.data { stroke: var(--link-always); }
  .edge.error { stroke: var(--link-failure); stroke-dasharray: 7 4; }
  .edge-label.error { color: var(--link-failure); }
  /* Record counts on links after a run (design/README.md 6.1 "Zeilenzähler an Links") */
  .rows { position: absolute; transform: translate(-50%, -50%); height: 20px; padding: 0 7px; display: inline-flex; align-items: center;
          border-radius: var(--rn-radius-full); background: var(--card); border: 1px solid var(--border); box-shadow: var(--rn-shadow-sm);
          font: 600 11px/1 var(--rn-font-mono); font-variant-numeric: tabular-nums; color: var(--foreground); white-space: nowrap; }
  .rows.error { color: var(--link-failure); border-color: var(--link-failure); }
  /* Chips above a node for settings that change how it runs: copies, distribution, forEach */
  .chips { position: absolute; left: -2px; top: -22px; display: flex; gap: 4px; }
  .chips .join { position: static; }
  .node .counts { white-space: nowrap; font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); color: var(--foreground); font-variant-numeric: tabular-nums; }
  .node .counts .e { color: var(--destructive); }
  /* Stacked look for copies: a second card edge behind the node */
  .node.stack { box-shadow: 5px 5px 0 -1px var(--node), 5px 5px 0 0 var(--node-border), var(--rn-shadow-sm); }
  .port.error-src { border-color: var(--link-failure); }
  /* Fields of a schema (incoming records, records on a link) */
  .fields { margin: 0 16px 12px; border: 1px solid var(--border); border-radius: var(--rn-radius-md); font-size: var(--rn-text-xs); }
  .fields .fr { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-bottom: 1px solid var(--border); }
  .fields .fr:last-child { border-bottom: 0; }
  .fields .fr .n { font-family: var(--rn-font-mono); }
  .fields .fr .ty { font: 10px var(--rn-font-mono); color: var(--muted-foreground); }
  .fields .fr.meta .n { color: var(--muted-foreground); }
  .fields .fr.open { color: var(--muted-foreground); font-style: italic; grid-template-columns: 1fr; }
  .fields .fr.used { background: color-mix(in srgb, var(--accent) 60%, transparent); }
  .input .expr { color: var(--expression); }
  .input .rec { color: var(--foreground); font-weight: 600; }
  .stepper { display: grid; grid-template-columns: 1fr 28px 28px; gap: 0; }
  .stepper .input { border-radius: var(--rn-radius-md) 0 0 var(--rn-radius-md); }
  .stepper button { border: 1px solid var(--input); border-left: 0; background: var(--background); color: var(--muted-foreground); }
  .stepper button:last-child { border-radius: 0 var(--rn-radius-md) var(--rn-radius-md) 0; }
  .help.warn { color: var(--warning); }
  .input.warning { border-color: var(--warning); outline: 2px solid var(--warning-soft); }
  .kv { margin: 0 16px 12px; }
  .kv .kvr { display: grid; grid-template-columns: 96px 1fr 24px; gap: 6px; margin-bottom: 6px; }
  .kv .kvr .x { display: grid; place-items: center; color: var(--muted-foreground); }
  .kv .add { display: inline-flex; align-items: center; gap: 6px; font-size: var(--rn-text-xs); color: var(--primary); }
  .lastrun.ok { background: color-mix(in srgb, var(--status-success) 12%, transparent); color: var(--status-success); }
  .lastrun .cnt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; color: var(--foreground); }
  .lastrun .cnt div { font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .lastrun .cnt b { display: block; font: 600 var(--rn-text-sm) var(--rn-font-mono); color: var(--foreground); font-variant-numeric: tabular-nums; }
  .lastrun .cnt b.e { color: var(--destructive); }


  /* Editing YAML (E9); code colours as in mockup E4, from tokens only */
  :root {
    --code-key: var(--foreground);
    --code-string: var(--rn-tiefe-700);
    --code-punct: var(--muted-foreground);
    --code-comment: var(--muted-foreground);
    --code-var: var(--expression);
    --code-gutter: var(--rn-tiefe-400);
    --code-line-active: var(--muted);
  }
  [data-theme="dark"] { --code-string: var(--rn-tiefe-300); --code-gutter: var(--rn-tiefe-600); }
  .body { grid-template-columns: 248px 1fr; }
  .view { position: relative; flex: 1; display: flex; min-height: 0; }
  .view.canvas { display: block; }
  .code { flex: 1; overflow: auto; padding: var(--rn-space-2) 0 var(--rn-space-6); font-family: var(--rn-font-mono);
          font-size: var(--rn-text-sm); line-height: 20px; outline: none; }
  .code.focus { box-shadow: inset 2px 0 0 var(--ring); }
  .line { display: grid; grid-template-columns: 20px 40px 1fr; position: relative; }
  .line.active { background: var(--code-line-active); }
  .mk { display: grid; place-items: center; font-size: 11px; font-weight: 700; user-select: none; }
  .mk.err { color: var(--destructive); }
  .mk.warn { color: var(--warning); }
  .ln { text-align: right; padding-right: var(--rn-space-4); color: var(--code-gutter); user-select: none; font-variant-numeric: tabular-nums; }
  .line.active .ln { color: var(--foreground); }
  .src { white-space: pre; padding-right: var(--rn-space-4); }
  .k { color: var(--code-key); font-weight: var(--rn-font-weight-medium); }
  .s { color: var(--code-string); }
  .p { color: var(--code-punct); }
  .c { color: var(--code-comment); font-style: italic; }
  .v { color: var(--code-var); background: var(--expression-soft); border-radius: 3px; }
  .squiggle { text-decoration: underline wavy var(--destructive); text-decoration-skip-ink: none; text-underline-offset: 3px; }
  .squiggle.warn { text-decoration-color: var(--warning); }
  .caret { display: inline-block; width: 2px; height: 16px; margin: 0 -1px; vertical-align: -3px; background: var(--foreground); }
  .changed { background: color-mix(in srgb, var(--accent) 70%, transparent); border-radius: 2px; }
  .tip { position: absolute; z-index: 3; width: 420px; padding: 8px 10px; background: var(--popover); color: var(--popover-foreground);
         border: 1px solid var(--border); border-radius: var(--rn-radius-md); box-shadow: var(--rn-shadow-md);
         font-family: var(--rn-font-sans); font-size: var(--rn-text-xs); line-height: 1.45; white-space: normal; }
  .tip .sym { color: var(--destructive); font-weight: 700; margin-right: 4px; }
  .tip .where { display: block; margin-top: 4px; font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .tip.small { width: auto; white-space: nowrap; }
  .tip kbd { font: 10px var(--rn-font-mono); padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; margin-left: 6px; }
  .checking { display: inline-flex; align-items: center; gap: 6px; font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .checking .spin { width: 9px; height: 9px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; }
  .segmented button .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--destructive); }

  .mock-controls { height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
                   font: 12px/1 var(--rn-font-mono); background: var(--rn-tiefe-950); color: var(--rn-tiefe-300); }
  .mock-controls a { color: var(--rn-strom-300); }
  .mock-controls b { color: var(--rn-tiefe-0); }
</style>
</head>
<body>
<div class="mock-controls" id="mock">
  <b>Mockup E9</b> theme: <a data-theme="light" href="#">light</a> <a data-theme="dark" href="#">dark</a> · state:
  <a data-state="edit" href="#">edit</a> <a data-state="problem" href="#">problem</a> <a data-state="syntax" href="#">syntax</a>
  <a data-state="canvas" href="#">canvas</a>
</div>

<div class="app" id="app">
  <header>
    <div class="brand">
      <img src="../logo/runnel-icon.svg" alt="" width="20" height="20">
      <img class="on-light" src="../logo/runnel-wordmark.svg" alt="Runnel" height="15">
      <img class="on-dark" src="../logo/runnel-wordmark-inverse.svg" alt="Runnel" height="15">
    </div>
    <div class="divider"></div>
    <span class="label">Project</span><b>hello</b>
    <span class="mono" style="font-size:12px;color:var(--muted-foreground)">C:\Runnel\projects\hello</span>
    <div class="spacer"></div>
    <div class="segmented">
      <button aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>System</button>
      <button><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Light</button>
      <button><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Dark</button>
    </div>
  </header>
  <div class="body">
    <aside class="split">
      <div class="panel-title label">Explorer</div>
      <ul class="tree" id="tree"></ul>
    </aside>
    <main>
      <div class="tabs" id="tabs"></div>
      <div class="filebar" id="filebar"></div>
      <div class="work">
        <div class="view" id="view"></div>
        <div class="bottom" id="bottom"></div>
      </div>
    </main>
  </div>
  <footer id="status"></footer>
</div>


<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme") === "dark" ? "dark" : "light";
  const state = params.get("state") || "edit";
  document.documentElement.dataset.theme = theme;
  if (params.get("controls") === "0") document.getElementById("mock").remove();
  else {
    document.getElementById("app").classList.add("with-controls");
    document.querySelectorAll("[data-theme]").forEach(a => a.href = `?theme=${a.dataset.theme}&state=${state}`);
    document.querySelectorAll("[data-state]").forEach(a => a.href = `?theme=${theme}&state=${a.dataset.state}`);
  }
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const icon = (d, size = 16) => `<svg class="i" viewBox="0 0 24 24" style="width:${size}px;height:${size}px">${d}</svg>`;
  const chev = '<svg class="i chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
  const chevRight = '<svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  const down = icon('<path d="M6 9l6 6 6-6"/>', 14);
  const play = '<path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/>';
  const kind = {
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    wf: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6h3a3 3 0 0 1 3 3v6a3 3 0 0 0 3 3"/>',
    env: '<path d="M4 6h16M4 12h16M4 18h10"/>',
    proj: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
  };
  const file = "hello.workflow.yaml";
  const dirty = true;

  // Explorer: examples/hello.
  const files = [["folder", "environments", 0, "2"], ["env", "dev.yaml", 1], ["env", "prod.yaml", 1], ["folder", "triggers", 0, "1"],
                 ["folder", "workflows", 0, "4"], ["wf", "answer.workflow.yaml", 1], ["wf", "collector.workflow.yaml", 1], ["wf", file, 1],
                 ["wf", "parallel.workflow.yaml", 1], ["proj", "project.yaml", 0]];
  document.getElementById("tree").innerHTML = files.map(([k, n, d, c]) =>
    `<li><div class="row ${d ? "d1" : ""} ${n === file ? "selected" : ""}">` +
    (k === "folder" ? (n === "triggers" ? chevRight : chev) : `<span style="width:12px"></span>`) +
    `<span class="k">${icon(kind[k])}</span>${n}${c ? `<span class="count">${c}</span>` : ""}</div></li>`).join("");

  const syntax = state === "syntax" || state === "canvas";
  const errors = state === "problem" || syntax ? 1 : 0;
  document.getElementById("tabs").innerHTML =
    `<div class="tab active">${icon(kind.wf)} ${file} <span class="dirty" title="Unsaved changes">●</span></div>`;
  const yamlView = state !== "canvas";
  document.getElementById("filebar").innerHTML = `
    <span class="crumbs" title="workflows/${file}"><b>${file}</b></span>
    ${errors ? `<span class="badge err" title="1 error">✖ 1</span>` : ""}
    ${state === "edit" ? `<span class="checking"><span class="spin"></span>Checking…</span>` : ""}
    <div class="spacer"></div>
    <span class="splitbtn"><button class="btn" title="Run with dev (F5)"><span class="play">${icon(play, 14)}</span>Run</button>
      <button class="btn" title="Run with other values…" aria-label="Run with other values">${down}</button></span>
    <div class="group" style="position:relative">
      <button class="icon-btn" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">${icon('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>', 14)}</button>
      <button class="icon-btn" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>${icon('<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>', 14)}</button>
      ${state === "edit" ? `<span class="tip small" style="right:-4px;top:34px">Undo typing in the YAML view<kbd>Ctrl+Z</kbd></span>` : ""}
    </div>
    <button class="btn primary" title="Save (Ctrl+S)">${icon('<path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3M7 21v-7h10v7"/>', 14)}Save</button>
    <div class="segmented" role="group" aria-label="View">
      <button aria-pressed="${!yamlView}" ${syntax ? 'title="The file has a syntax error: the canvas shows where it is"' : ""}>${icon(kind.wf, 14)}Canvas${syntax ? '<span class="dot"></span>' : ""}</button>
      <button aria-pressed="${yamlView}">${icon('<path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/>', 14)}YAML</button>
    </div>`;

  // The file; the changed line depends on the state.
  const lines = [
    "# A small, valid workflow. Check it with:  runnel validate examples/hello",
    "kind: Workflow", "apiVersion: runnel/v1", "name: hello",
    "description: Greets, waits a moment and reports success or failure.",
    "parameters:", "  - name: GREETING", "    description: Word to greet with", "    enum: [Hello, Hi, Moin]", "    default: Hello",
    "outputs:", "  - name: MESSAGE", "    description: The greeting that was logged", '    value: "${GREETING}, ${TARGET}!"',
    "actions:", "  - id: start", "    type: core.start", "  - id: greet", "    type: core.log", "    with:",
    '      message: "${GREETING}, ${TARGET}! (${STAGE} on ${env:COMPUTERNAME}, files in ${OUTBOX})"',
    "  - id: pause", "    type: core.wait", "    with:", "      duration: 2s",
    "  - id: done", "    type: core.success", "  - id: failed", "    type: core.abort",
    "links:", "  - { from: start, to: greet }", "  - { from: greet, to: pause }", "  - { from: pause, to: done }",
    "  - { from: pause, to: failed, when: failure }",
    "layout:", "  start:  { x: 40, y: 120 }", "  greet:  { x: 280, y: 120 }", "  pause:  { x: 520, y: 120 }",
    "  done:   { x: 760, y: 120 }", "  failed: { x: 760, y: 260 }",
  ];
  if (state === "problem") lines[24] = "      duration: 5 minutes";
  if (syntax) lines[22] = "    type core.wait";

  // Minimal highlighter as in mockup E4: comments, keys, punctuation, values, ${…}.
  const vars = v => esc(v).replace(/(\$\{[^}]*\})/g, `<span class="v">$1</span>`);
  function value(v) {
    if (/^\s*\{.*\}\s*$/.test(v) || /^\s*\[.*\]\s*$/.test(v)) {
      return esc(v).replace(/([{}\[\],])/g, `<span class="p">$1</span>`).replace(/(\w+)(:)/g, `<span class="k">$1</span><span class="p">$2</span>`);
    }
    return `<span class="s">${vars(v)}</span>`;
  }
  function highlight(line) {
    if (/^\s*#/.test(line)) return `<span class="c">${esc(line)}</span>`;
    const m = line.match(/^(\s*)(- )?([\w.-]+)(:)(.*)$/);
    if (m) {
      const [, ind, dash, key, colon, rest] = m;
      return ind + (dash ? `<span class="p">- </span>` : "") + `<span class="k">${key}</span><span class="p">${colon}</span>` + value(rest);
    }
    const d = line.match(/^(\s*)(- )(.*)$/);
    if (d) return d[1] + `<span class="p">- </span>` + value(d[3]);
    return `<span class="s">${esc(line)}</span>`;
  }

  const view = document.getElementById("view");
  const active = state === "edit" ? 25 : state === "problem" ? 25 : 23;
  if (yamlView) {
    view.innerHTML = `<div class="code focus" role="textbox" aria-multiline="true" aria-label="YAML">` + lines.map((l, i) => {
      const n = i + 1;
      let src = highlight(l) || " ";
      let mk = "";
      if (n === 25 && state === "edit") src = src.replace("2s", `<span class="changed">2s</span><span class="caret"></span>`);
      if (n === 25 && state === "problem") { src = src.replace("5 minutes", `<span class="squiggle">5 minutes</span><span class="caret"></span>`); mk = `<span class="mk err" title="1 error">✖</span>`; }
      if (n === 23 && syntax) { src = `    <span class="squiggle">type core.wait</span><span class="caret"></span>`; mk = `<span class="mk err" title="1 error">✖</span>`; }
      const tip = n === 25 && state === "problem"
        ? `<span class="tip" style="left:178px;bottom:22px"><span class="sym">✖</span>action "pause": invalid duration "5 minutes" (examples: 30s, 5m, 2h, 1h30m)<span class="where">with.duration · 25:17</span></span>`
        : n === 23 && syntax
        ? `<span class="tip" style="left:96px;bottom:22px"><span class="sym">✖</span>syntax error: a key needs a colon, e.g. “type: core.wait”. Until it is fixed, the canvas cannot show the workflow.<span class="where">23:5</span></span>`
        : "";
      return `<div class="line ${n === active ? "active" : ""}">${mk || "<span></span>"}<span class="ln">${n}</span><span class="src">${src}</span>${tip}</div>`;
    }).join("") + `</div>`;
  } else {
    // The canvas while the text cannot be read (state "invalid" of mockup E5).
    view.className = "view canvas";
    view.innerHTML = `<div class="canvas" style="position:absolute;inset:0"><div class="blocked"><div class="box">
      <span class="symbol">✖</span>
      <h2>This workflow can’t be shown as a graph</h2>
      <p>The file has a syntax error. Fix it in the YAML view; your changes are kept.</p>
      <pre class="mono">workflows/hello.workflow.yaml:23:5
syntax error: a key needs a colon, e.g. “type: core.wait”</pre>
      <button class="btn">${icon('<path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/>', 14)}Show YAML at line 23</button>
    </div></div></div>`;
  }

  // Below: Problems | Log
  const bottom = document.getElementById("bottom");
  const problem = state === "problem"
    ? [`action "pause": invalid duration "5 minutes" (examples: 30s, 5m, 2h, 1h30m)`, "pause · with.duration", "25:17"]
    : [`syntax error: a key needs a colon, e.g. “type: core.wait”`, "", "23:5"];
  bottom.innerHTML = errors
    ? `<div class="tabs2"><span class="t2 active">${chev}Problems <span class="n">1</span></span><span class="t2">${chevRight}Log</span></div>
       <div class="ptable" style="height:96px">
         <div class="prow phead"><span></span><span>Message</span><span>Where</span><span>Line</span></div>
         <div class="prow sel"><span class="sym err">✖</span><span>${problem[0]}</span><span class="where">${problem[1]}</span><span class="line">${problem[2]}</span></div>
       </div>`
    : `<div class="tabs2"><span class="t2">${chevRight}Problems</span><span class="t2">${chevRight}Log</span></div>`;

  document.getElementById("status").innerHTML =
    `<span class="ok">● Connected</span><span class="mono" style="font-size:11px">127.0.0.1:7300</span>` +
    (yamlView ? `<span>YAML · UTF-8 · 40 lines</span><span>Ln ${active}, Col ${state === "edit" ? 19 : state === "problem" ? 26 : 19}</span>` : `<span>Workflow · not readable</span>`) +
    `<span class="dirty">● Unsaved changes</span><span class="spacer"></span><span>Runnel v0.1.0</span>`;
</script>
</body>
</html>
