<!doctype html>
<!--
  Mockup S16d – Icons for the transforms core.calculate and core.dedupe (S16c), which still
  show the generic symbol, and for core.sequence (S16d, planned). Two variants each to
  choose from. Line icons as in web/src/components/Icons.tsx and mockup E13: 24 × 24,
  stroke 1.6, currentColor, white on the tile in the colour of the category.
  Static, design tokens only.

  Query parameters:
    theme = light | dark                (default light)
    state = choice | canvas             (default choice)
    controls = 0                        hides the mockup control bar (screenshots)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icons – Runnel</title>
<link rel="icon" href="../logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../tokens/runnel.css">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--rn-font-sans); font-size: var(--rn-text-sm); line-height: 1.5;
         color: var(--foreground); background: var(--background); -webkit-font-smoothing: antialiased; }
  code, .mono { font-family: var(--rn-font-mono); }
  svg.i { flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .page { padding: 20px 28px; }
  h1 { font-size: var(--rn-text-lg); margin: 0 0 2px; }
  .sub { margin: 0 0 6px; color: var(--muted-foreground); font-size: var(--rn-text-xs); }
  h2 { font-size: var(--rn-text-sm); margin: 14px 0 6px; } h2 small { color: var(--muted-foreground); font-weight: 400; }
  .label { font-size: var(--rn-text-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground); }
  .tile { display: grid; place-items: center; border-radius: var(--rn-radius-md); color: var(--rn-tiefe-0); flex: none; }

  /* overview */
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .card { position: relative; display: flex; gap: 8px; align-items: center; height: 46px; padding: 0 8px;
          border: 1px solid var(--border); border-radius: var(--rn-radius-md); background: var(--card); min-width: 0; }
  .card.new { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring) inset; }
  .card .t { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .card b { font-weight: 500; font-size: var(--rn-text-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card code { font-size: 10px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { position: absolute; top: -7px; right: 6px; font-size: 9px; font-weight: 600; padding: 0 5px; border-radius: 999px;
           background: var(--primary); color: var(--primary-foreground); letter-spacing: .04em; }
  .legend { display: flex; gap: 14px; align-items: center; font-size: var(--rn-text-xs); color: var(--muted-foreground); margin-top: 12px; }

  /* sizes */
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 3px 10px; border-bottom: 1px solid var(--border); font-size: var(--rn-text-xs); }
  th { font-weight: 600; color: var(--muted-foreground); }
  td .mono { color: var(--muted-foreground); font-size: 11px; }
  td.c { text-align: center; } th.c { text-align: center; }
  .plain { color: var(--foreground); }

  /* canvas */
  .ctx { display: grid; grid-template-columns: 248px 1fr; height: 100%; }
  aside { background: var(--sidebar); color: var(--sidebar-foreground); border-right: 1px solid var(--sidebar-border); padding: 10px 8px; }
  .pal-row { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px; border-radius: var(--rn-radius-md); }
  .pal-row small { display: block; font: 10px var(--rn-font-mono); color: var(--muted-foreground); }
  .pal-row span.n { line-height: 1.2; }
  .pal-cat { margin: 10px 8px 4px; }
  .canvas { position: relative; background-color: var(--canvas, var(--background));
            background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 16px 16px; }
  .node { position: absolute; width: 196px; height: 52px; display: flex; align-items: center; gap: 10px;
          padding: 0 12px 0 10px; background: var(--node); border: 1px solid var(--node-border);
          border-radius: var(--rn-radius-lg); box-shadow: var(--rn-shadow-sm); }
  .node .id { font-weight: 600; } .node .type { font: var(--rn-text-2xs) var(--rn-font-mono); color: var(--muted-foreground); }
  .node .text { line-height: 1.25; }
  .canvas svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; }
  .canvas svg.edges path { stroke: var(--link-success); stroke-width: 1.5; fill: none; }
  .canvas .title { position: absolute; left: 20px; top: 14px; }

  .app { height: 100vh; overflow: hidden; } .app.with-controls { height: calc(100vh - 40px); }
  .mock-controls { height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
                   font: 12px/1 var(--rn-font-mono); background: var(--rn-tiefe-950); color: var(--rn-tiefe-300); }
  .mock-controls a { color: var(--rn-strom-300); }
  .mock-controls b { color: var(--rn-tiefe-0); }

  .variant { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-weight: 700; font-size: 11px;
             background: var(--muted); color: var(--foreground); margin-right: 6px; }
  td.why { color: var(--muted-foreground); max-width: 360px; }
  tr.group td { background: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<div class="mock-controls" id="mock">
  <b>Mockup S16d</b> theme: <a data-theme="light" href="#">light</a> <a data-theme="dark" href="#">dark</a> · state:
  <a data-state="choice" href="#">choice</a> <a data-state="canvas" href="#">canvas</a>
</div>
<div class="app" id="app"></div>
<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme") === "dark" ? "dark" : "light";
  const state = params.get("state") || "choice";
  document.documentElement.dataset.theme = theme;
  if (params.get("controls") === "0") document.getElementById("mock").remove();
  else {
    document.getElementById("app").classList.add("with-controls");
    document.querySelectorAll("[data-theme]").forEach(a => a.href = `?theme=${a.dataset.theme}&state=${state}`);
    document.querySelectorAll("[data-state]").forEach(a => a.href = `?theme=${theme}&state=${a.dataset.state}`);
  }
  const svg = (body, size) => `<svg class="i" viewBox="0 0 24 24" width="${size}" height="${size}">${body}</svg>`;
  const color = { input: "eingabe", transform: "transformation", flow: "fluss", combine: "transformation", output: "ausgabe" };
  const tileOf = (body, category, box, size) => `<span class="tile" style="width:${box}px;height:${box}px;background:var(--rn-kategorie-${color[category]})">${svg(body, size)}</span>`;

  // The variants. A is proposed.
  const variants = {
    "core.calculate": { label: "Calculate", category: "transform",
      A: ['<path d="M9 4c-2 0-3 1-3 3v2.5C6 11 5 12 3.5 12 5 12 6 13 6 14.5V17c0 2 1 3 3 3M15 4c2 0 3 1 3 3v2.5c0 1.5 1 2.5 2.5 2.5-1.5 0-2.5 1-2.5 2.5V17c0 2-1 3-3 3"/><path d="M10 12h4M12 10v4"/>',
          "Braces with a plus: an expression {{ … }} that calculates – the braces are the sign of expressions in the editor (fx in the panel)"],
      B: ['<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 7h7M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 18h.01M12 18h7"/>',
          "A calculator: clear, but busy at 13 px in the palette"] },
    "core.dedupe": { label: "Remove Duplicates", category: "combine",
      A: ['<rect x="3" y="3" width="11" height="11" rx="2"/><path d="M10 17v2a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-2" stroke-dasharray="2.4 2.2"/>',
          "A record and its copy, the copy dashed (dropped) – like the copy symbol of the editor, with the second card faded out"],
      B: ['<path d="M4 6h12M4 11h12M4 16h7"/><path d="M15.5 14.5l5 5M20.5 14.5l-5 5"/>',
          "A list with a removed entry: clear, but it would also fit core.filter or file.delete"] },
    "core.sequence": { label: "Sequence", category: "transform",
      A: ['<path d="M5 4l1.5-1v6M4.5 9h3"/><path d="M6 13v7M3.5 17.5L6 20l2.5-2.5"/><path d="M11 6h9M11 12h9M11 18h9"/>',
          "A list numbered from 1 downwards: one number per record, in order"],
      B: ['<path d="M10 4L8 20M16 4l-2 16M5 9h15M4 15h15"/>',
          "A number sign (#): short and known, but less telling that the numbers count up"] },
  };
  const app = document.getElementById("app");

  if (state === "choice") {
    const rows = Object.entries(variants).map(([type, v]) =>
      `<tr class="group"><td colspan="7">${v.label} <span class="mono" style="font-weight:400">${type}</span> · category ${v.category}</td></tr>` +
      ["A", "B"].map(k => `<tr><td><span class="variant">${k}</span>${k === "A" ? "proposed" : "alternative"}</td>
        <td class="c">${tileOf(v[k][0], v.category, 22, 13)}</td><td class="c">${tileOf(v[k][0], v.category, 28, 16)}</td><td class="c">${tileOf(v[k][0], v.category, 40, 24)}</td>
        <td class="c plain">${svg(v[k][0], 16)}</td><td class="c plain">${svg(v[k][0], 24)}</td><td class="why">${v[k][1]}</td></tr>`).join("")).join("");
    app.innerHTML = `<div class="page">
      <h1>Icons for Calculate, Remove Duplicates and Sequence</h1>
      <p class="sub">Two variants each; A is proposed. Palette 22/13 px, canvas node 28/16 px, properties panel 40/24 px, and without a tile.</p>
      <table><thead><tr><th>Variant</th><th class="c">Palette</th><th class="c">Node</th><th class="c">Panel</th><th class="c">16 px</th><th class="c">24 px</th><th>Idea</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }
  if (state === "canvas") {
    const known = {
      "csv.input": ['<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6"/>', "input", "CSV Input"],
      "csv.output": ['<path d="M6 3h8l4 4v14H6zM14 3v4h4M12 11v7M9 15l3 3 3-3"/>', "output", "CSV Output"],
      "core.sort": ['<path d="M7 4v16M4 17l3 3 3-3M14 6h6M14 12h4M14 18h2"/>', "combine", "Sort"],
      "core.constant": ['<path d="M12 5v14M5 12h14"/>', "transform", "Add Constants"],
      "core.convert": ['<path d="M5 8h11l-3-3M19 16H8l3 3"/>', "transform", "Convert Types"],
      "core.filter": ['<path d="M4 5h16l-6 7v6l-4 2v-8z"/>', "transform", "Filter"],
      "core.group-by": ['<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><path d="M7.5 11v4h9v-4M12 15v5"/>', "combine", "Group By"],
    };
    for (const [t, v] of Object.entries(variants)) known[t] = [v.A[0], v.category, v.label];
    const tile = (t, box, size) => tileOf(known[t][0], known[t][1], box, size);
    const palRow = t => `<div class="pal-row">${tile(t, 22, 13)}<span class="n">${known[t][2]}<small>${t}</small></span></div>`;
    const nodes = [["read","csv.input",40,80],["calculate","core.calculate",280,80],["unique","core.dedupe",520,80],
      ["order","core.sort",280,200],["rank","core.sequence",520,200],["write","csv.output",760,200]];
    const edges = [[0,1],[1,2],[0,3],[3,4],[4,5]];
    const path = ([a,b]) => { const [, , x1, y1] = nodes[a], [, , x2, y2] = nodes[b]; const sx = x1 + 196, sy = y1 + 26 + 46, ex = x2, ey = y2 + 26 + 46;
      return `<path d="M${sx} ${sy} C ${sx + 40} ${sy}, ${ex - 40} ${ey}, ${ex} ${ey}"/>`; };
    app.innerHTML = `<div class="ctx">
      <aside><div class="label pal-cat">Transform</div>${["core.calculate","core.constant","core.convert","core.filter","core.sequence"].map(palRow).join("")}
        <div class="label pal-cat">Combine</div>${["core.dedupe","core.group-by","core.sort"].map(palRow).join("")}</aside>
      <div class="canvas"><div class="title label">Pipeline · contacts.pipeline.yaml (variant A)</div>
        <svg class="edges">${edges.map(path).join("")}</svg>
        ${nodes.map(([id, t, x, y]) => `<div class="node" style="left:${x}px;top:${y + 46}px">${tile(t, 28, 16)}<span class="text"><span class="id">${id}</span><br><span class="type">${t}</span></span></div>`).join("")}
      </div></div>`;
  }
</script>
</body>
</html>
