<!doctype html>
<!--
  Mockup E23 – Data per step in a workflow: after a run, the tab "Data" below the canvas shows
  for the selected action what reached it (Input: with: after variables and expressions,
  secrets masked) and what it returned (Output: result.output as a tree, a table or JSON),
  with the path of a value for expressions, its own log lines, the entry of forEach and the
  run of a loop. Nodes that have data carry a small sign on the canvas; the tab follows the
  selection. Builds on the approved mockups E4 (shell), E7 (properties), E8 (run, log),
  S26d (runs), S35 (expressions), S39f (secrets) and S44 (data preview). Static, design tokens only.

  Query parameters:
    theme = light | dark                                                    (default light)
    state = output | table | input | loop | failed | skipped | empty | history | truncated
                                                                            (default output)
    controls = 0                                   hides the mockup control bar (screenshots)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sync-orders – Runnel</title>
<link rel="icon" href="../logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../tokens/runnel.css">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--rn-font-sans); font-size: var(--rn-text-sm); line-height: 1.5; color: var(--foreground);
         background: var(--background); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  code, .mono { font-family: var(--rn-font-mono); }
  a { color: var(--primary); text-underline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6;
          stroke-linecap: round; stroke-linejoin: round; }

  /* Shell (E4) */
  .app { display: grid; grid-template-rows: 48px 1fr 24px; height: 100vh; position: relative; }
  .app.with-controls { height: calc(100vh - 40px); }
  .body { display: grid; grid-template-columns: 248px 1fr 320px; min-height: 0; }
  header { display: flex; align-items: center; gap: var(--rn-space-4); padding: 0 var(--rn-space-4); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: var(--rn-space-2); }
  .brand .on-dark { display: none; }
  [data-theme="dark"] .brand .on-light { display: none; }
  [data-theme="dark"] .brand .on-dark { display: inline; }
  .divider { width: 1px; height: 24px; background: var(--border); }
  .label { font-size: var(--rn-text-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground); }
  .spacer { flex: 1; }
  .segmented { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--border); border-radius: var(--rn-radius-md); background: var(--muted); }
  .segmented button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 3px 8px;
                      border-radius: var(--rn-radius-sm); font-size: var(--rn-text-xs); color: var(--muted-foreground); cursor: pointer; white-space: nowrap; }
  .segmented button[aria-pressed="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--rn-shadow-sm); }
  .segmented svg.i { width: 14px; height: 14px; }
  .segmented.small button { padding: 1px 7px; font-size: var(--rn-text-2xs); }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--sidebar); color: var(--sidebar-foreground);
          border-right: 1px solid var(--sidebar-border); }
  .panel-title { display: flex; align-items: center; height: 36px; padding: 0 16px; flex: none; }
  .tree { list-style: none; margin: 0; padding: 0 8px; }
  .row { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: var(--rn-radius-sm); white-space: nowrap; }
  .row.selected { background: var(--accent); color: var(--accent-foreground); font-weight: 500; }
  .row .k { color: var(--muted-foreground); display: inline-flex; }
  .row.selected .k { color: var(--accent-foreground); }
  .row .tag { margin-left: auto; font: 10px var(--rn-font-mono); color: var(--muted-foreground); }
  .chev { width: 12px; height: 12px; color: var(--muted-foreground); }
  .d1 { padding-left: 26px; }
  .count { margin-left: auto; font-size: var(--rn-text-2xs); color: var(--muted-foreground); font-weight: 400; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs { display: flex; height: 36px; border-bottom: 1px solid var(--border); background: var(--muted); flex: none; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-right: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
  .tab.active { background: var(--background); color: var(--foreground); box-shadow: inset 0 2px 0 var(--primary); margin-bottom: -1px; }
  .filebar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-bottom: 1px solid var(--border); flex: none; white-space: nowrap; }
  .crumbs { font-family: var(--rn-font-mono); font-size: var(--rn-text-xs); color: var(--muted-foreground); }
  .crumbs b { color: var(--foreground); font-weight: 500; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--input);
         border-radius: var(--rn-radius-md); background: var(--background); font-size: var(--rn-text-xs); font-weight: 500; white-space: nowrap; cursor: pointer; }
  .btn.small { height: 22px; padding: 0 7px; font-size: var(--rn-text-2xs); gap: 4px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted-foreground); }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .btn svg.i { width: 13px; height: 13px; }
  .btn kbd, kbd { font: 10px var(--rn-font-mono); }
  .btn kbd { opacity: .75; }
  .btn .play { color: var(--status-success); display: inline-flex; }
  .splitbtn { display: inline-flex; }
  .splitbtn .btn:first-child { border-radius: var(--rn-radius-md) 0 0 var(--rn-radius-md); }
  .splitbtn .btn:last-child { border-radius: 0 var(--rn-radius-md) var(--rn-radius-md) 0; border-left: 0; padding: 0 6px; }
  .icon-btn { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 1px solid transparent; border-radius: var(--rn-radius-md);
              background: transparent; color: var(--muted-foreground); cursor: pointer; }
  .icon-btn.bordered { border-color: var(--input); background: var(--background); color: var(--foreground); }
  .icon-btn[disabled] { opacity: .4; }
  footer { display: flex; align-items: center; gap: 16px; padding: 0 12px; border-top: 1px solid var(--border);
           background: var(--muted); color: var(--muted-foreground); font-size: var(--rn-text-xs); white-space: nowrap; }
  footer .ok { color: var(--success); }

  /* Run opened from the history (S26d) */
  .runinfo { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 16px; border-bottom: 1px solid var(--border);
             background: var(--muted); font-size: var(--rn-text-xs); flex: none; white-space: nowrap; }
  .runinfo .mono { font-size: var(--rn-text-2xs); }

  /* Canvas (design/README.md, 6.1) */
  .work { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .canvas { position: relative; flex: 1; overflow: hidden; background-color: var(--canvas);
            background-image: radial-gradient(circle, var(--canvas-grid) 1px, transparent 1.2px); background-size: 16px 16px; }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  svg.edges { position: absolute; left: 0; top: 0; overflow: visible; }
  .edge { fill: none; stroke-width: 2; }
  .edge.success { stroke: var(--link-success); }
  .edge.failure { stroke: var(--link-failure); }
  .edge.dead { opacity: .3; }
  .edge-label { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px;
                border-radius: var(--rn-radius-full); background: var(--card); border: 1.5px solid currentColor; font-size: 11px; font-weight: 700; line-height: 1; }
  .edge-label.success { color: var(--link-success); }
  .edge-label.failure { color: var(--link-failure); }
  .edge-label.dead { opacity: .45; }
  .node { position: absolute; width: 190px; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 10px;
          background: var(--node); border: 1px solid var(--node-border); border-radius: var(--rn-radius-lg); box-shadow: var(--rn-shadow-sm); cursor: pointer; }
  .node.selected { outline: 2px solid var(--node-selected); outline-offset: 1px; }
  .node.dim { opacity: .55; }
  .node .text { min-width: 0; line-height: 1.25; }
  .node .id { font-weight: 600; white-space: nowrap; }
  .node .type { font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .type .dur { color: var(--foreground); }
  .tile { display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--rn-radius-md);
          background: var(--rn-kategorie-allgemein); color: var(--rn-tiefe-0); flex: none; }
  .port { position: absolute; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--node); border: 1.5px solid var(--node-border); }
  .port.in { left: -5px; } .port.out { right: -5px; }
  .runbar { position: absolute; left: 6px; right: 6px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; }
  .runbar.succeeded { background: var(--status-success); }
  .runbar.failed { background: var(--status-failed); }
  .runbar.skipped { height: 0; border-top: 3px dashed var(--status-skipped); }
  .marker { position: absolute; top: -9px; right: -9px; display: grid; place-items: center; width: 20px; height: 20px;
            border-radius: 50%; font-size: 11px; font-weight: 700; color: var(--rn-tiefe-0); box-shadow: var(--rn-shadow-sm); }
  .marker.succeeded { background: var(--status-success); }
  .marker.failed { background: var(--status-failed); }
  .marker.skipped { background: var(--status-skipped); }
  .chips { position: absolute; left: -2px; top: -22px; display: flex; gap: 4px; }
  .join { height: 18px; padding: 0 6px; display: inline-flex; align-items: center; border-radius: var(--rn-radius-sm); border: 1px solid var(--border);
          background: var(--card); font: 500 10px/1 var(--rn-font-mono); color: var(--muted-foreground); white-space: nowrap; }
  /* New in E23: the node has data of the last run */
  .datasign { position: absolute; right: 10px; bottom: -9px; display: inline-flex; align-items: center; gap: 3px; height: 17px; padding: 0 5px;
              border-radius: var(--rn-radius-full); background: var(--card); border: 1px solid var(--border); box-shadow: var(--rn-shadow-sm);
              font: 600 10px/1 var(--rn-font-mono); color: var(--muted-foreground); }
  .node.selected .datasign { border-color: var(--node-selected); color: var(--foreground); }
  .controls-panel { position: absolute; left: 16px; bottom: 16px; display: flex; flex-direction: column; background: var(--card);
                    border: 1px solid var(--border); border-radius: var(--rn-radius-md); box-shadow: var(--rn-shadow-sm); overflow: hidden; }
  .controls-panel span { display: grid; place-items: center; width: 28px; height: 28px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
  .controls-panel span:last-child { border-bottom: 0; }
  .zoom { position: absolute; left: 52px; bottom: 16px; height: 22px; padding: 0 8px; display: inline-flex; align-items: center;
          background: var(--card); border: 1px solid var(--border); border-radius: var(--rn-radius-sm); font: 11px var(--rn-font-mono); color: var(--muted-foreground); }
  .tooltip { position: absolute; z-index: 5; max-width: 320px; padding: 6px 10px; border-radius: var(--rn-radius-md); background: var(--popover);
             color: var(--popover-foreground); border: 1px solid var(--border); box-shadow: var(--rn-shadow-md); font-size: var(--rn-text-xs); line-height: 1.4; white-space: nowrap; }
  .tooltip small { display: block; color: var(--muted-foreground); font-size: var(--rn-text-2xs); }

  /* Panel below the canvas (E7, E8, S44) */
  .bottom { flex: none; border-top: 1px solid var(--border); background: var(--background); display: flex; flex-direction: column; }
  .splitter { height: 5px; margin-top: -3px; cursor: row-resize; }
  .tabs2 { display: flex; align-items: center; height: 32px; padding: 0 8px; gap: 2px; flex: none; }
  .t2 { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--rn-radius-sm);
        font-size: var(--rn-text-xs); color: var(--muted-foreground); white-space: nowrap; }
  .t2.active { background: var(--muted); color: var(--foreground); font-weight: 500; }
  .t2 .n { display: inline-grid; place-items: center; min-width: 18px; height: 16px; padding: 0 5px; border-radius: var(--rn-radius-full);
           font-size: 10px; font-weight: 600; background: var(--danger-soft); color: var(--destructive); }
  .tabs2 .follow { margin-left: auto; font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .data { height: 412px; display: flex; flex-direction: column; border-top: 1px solid var(--border); min-height: 0; }

  /* Head of the step (new in E23) */
  .dhead { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: none; white-space: nowrap; }
  .dhead .tile { width: 24px; height: 24px; border-radius: var(--rn-radius-sm); }
  .dhead .tile svg.i { width: 14px; height: 14px; }
  .dhead .who { display: flex; align-items: baseline; gap: 6px; }
  .dhead .who b { font-weight: 600; }
  .dhead .who .mono { font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .dhead .meta { display: flex; align-items: center; gap: 8px; font-size: var(--rn-text-xs); color: var(--muted-foreground); }
  .dhead .meta .sep { color: var(--border); }
  .dhead .runlink { font-size: var(--rn-text-2xs); color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 4px; }
  .dhead .runlink a { font-family: var(--rn-font-mono); }
  .st { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: var(--rn-radius-full);
        font-size: var(--rn-text-2xs); font-weight: 600; white-space: nowrap; }
  .st.succeeded { background: var(--success-soft); color: var(--success); }
  .st.failed { background: var(--danger-soft); color: var(--destructive); }
  .st.skipped { background: var(--muted); color: var(--muted-foreground); border: 1px dashed var(--status-skipped); }
  .attempts { display: inline-flex; align-items: center; gap: 4px; }
  .attempts .w { color: var(--warning); font-weight: 700; }

  /* Entries of forEach and runs of a loop */
  .entries { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: none;
             font-size: var(--rn-text-xs); color: var(--muted-foreground); white-space: nowrap; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper .pos { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: 1px solid var(--input);
                  border-radius: var(--rn-radius-md); background: var(--background); color: var(--foreground); font-variant-numeric: tabular-nums; }
  .stepper .pos svg.i { width: 12px; height: 12px; color: var(--muted-foreground); }
  .strip { display: flex; gap: 3px; }
  .strip span { display: grid; place-items: center; width: 22px; height: 20px; border-radius: var(--rn-radius-sm); font: 600 10px/1 var(--rn-font-mono);
                background: var(--muted); color: var(--muted-foreground); border: 1px solid transparent; font-variant-numeric: tabular-nums; }
  .strip span.ok { color: var(--success); }
  .strip span.err { background: var(--danger-soft); color: var(--destructive); }
  .strip span.none { opacity: .5; border-style: dashed; border-color: var(--border); background: transparent; }
  .strip span.on { border-color: var(--node-selected); background: var(--accent); color: var(--accent-foreground); }

  /* Input | Output */
  .panes { display: grid; grid-template-columns: 340px 1fr; flex: 1; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--border); }
  .phead { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 12px; flex: none; white-space: nowrap; }
  .phead .sub { font-size: var(--rn-text-2xs); color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; }
  .phead .sub .mono { font-size: var(--rn-text-2xs); }
  .pscroll { flex: 1; overflow: auto; min-height: 0; border-top: 1px solid var(--border); }

  /* Tree of values (key, type, value) */
  .tr { display: grid; grid-template-columns: minmax(150px, 210px) 64px 1fr; align-items: center; min-height: 24px; padding: 0 10px 0 4px;
        font: var(--rn-text-2xs) var(--rn-font-mono); white-space: nowrap; }
  .tr:hover, .tr.hover { background: var(--muted); }
  .tr.sel { background: var(--accent); color: var(--accent-foreground); }
  .tr .key { display: flex; align-items: center; gap: 2px; overflow: hidden; }
  .tr .key .tw { display: inline-grid; place-items: center; width: 14px; color: var(--muted-foreground); flex: none; }
  .tr .key .tw svg.i { width: 11px; height: 11px; }
  .tr .key .idx { color: var(--muted-foreground); }
  .tr .ty { color: var(--muted-foreground); font-size: 10px; }
  .tr .val { overflow: hidden; text-overflow: ellipsis; }
  .tr .val.str { color: var(--foreground); }
  .tr .val.num { color: var(--expression); }
  .tr .val.bool { color: var(--expression); }
  .tr .val.null, .tr .val.sum { color: var(--muted-foreground); font-style: italic; font-family: var(--rn-font-sans); }
  .tr .val .more { font-family: var(--rn-font-sans); font-style: normal; margin-left: 6px; }

  /* Input: values as they reached the action */
  .ir { display: grid; grid-template-columns: 112px 1fr; gap: 8px; padding: 4px 12px; border-bottom: 1px solid var(--border); font-size: var(--rn-text-2xs); }
  .ir:last-child { border-bottom: 0; }
  .ir .k { font-family: var(--rn-font-mono); font-weight: 500; padding-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ir .k.child { padding-left: 12px; color: var(--muted-foreground); font-weight: 400; }
  .ir .k.child b { color: var(--foreground); font-weight: 500; }
  .ir .v { min-width: 0; font-family: var(--rn-font-mono); overflow-wrap: anywhere; }
  .ir .v .def { margin-left: 6px; font-family: var(--rn-font-sans); color: var(--muted-foreground); }
  .ir .v .src { display: block; margin-top: 1px; color: var(--expression); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ir .v .src::before { content: "from "; color: var(--muted-foreground); font-family: var(--rn-font-sans); }
  .ir .v .num { color: var(--expression); }
  .ir .v .long { white-space: pre-wrap; display: block; max-height: 48px; overflow: hidden; position: relative; }
  .ir .v .showall { display: inline-flex; gap: 4px; margin-top: 2px; font-family: var(--rn-font-sans); font-size: 10px; color: var(--muted-foreground); }
  .ir .v .showall a { font-weight: 500; }
  .secret { display: inline-flex; align-items: center; gap: 5px; }
  .secret .stars { letter-spacing: .1em; }
  .secret svg.i { width: 12px; height: 12px; color: var(--muted-foreground); }
  .secret .ref { color: var(--expression); font-size: 10px; }
  .igroup { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; font-size: var(--rn-text-2xs); font-weight: 600;
            background: var(--muted); border-bottom: 1px solid var(--border); color: var(--muted-foreground); }
  .igroup .mono { font-weight: 500; color: var(--foreground); }
  .igroup .r { margin-left: auto; font-weight: 400; }

  /* Table of a list of objects (as the data preview S44) */
  .pvtable table { border-collapse: collapse; min-width: 100%; }
  .pvtable th { position: sticky; top: 0; z-index: 1; background: var(--muted); text-align: left; font-weight: 500; height: 30px; font-size: var(--rn-text-2xs);
                padding: 0 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; }
  .pvtable th .ty { display: block; font: 10px var(--rn-font-mono); color: var(--muted-foreground); font-weight: 400; line-height: 1; }
  .pvtable th.n, .pvtable td.n { width: 36px; text-align: right; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .pvtable td { height: 24px; padding: 0 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
                font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .pvtable td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pvtable td.obj { color: var(--muted-foreground); font-style: italic; font-family: var(--rn-font-sans); }
  .pvtable tr:hover td { background: var(--muted); }
  .pvtable td.sel { outline: 2px solid var(--ring); outline-offset: -2px; background: var(--accent); color: var(--accent-foreground); }
  .pvjson { margin: 0; padding: 8px 12px; font: var(--rn-text-2xs)/1.6 var(--rn-font-mono); color: var(--foreground); }
  .pvjson .k { font-weight: 500; }
  .pvjson .s { color: var(--muted-foreground); }
  .pvjson .num { color: var(--expression); }

  /* Path of the chosen value */
  .pathbar { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px 0 12px; border-top: 1px solid var(--border); flex: none;
             background: var(--muted); font-size: var(--rn-text-2xs); color: var(--muted-foreground); white-space: nowrap; }
  .pathbar .p { flex: 0 1 auto; font-family: var(--rn-font-mono); color: var(--expression); background: var(--expression-soft); padding: 1px 6px; border-radius: var(--rn-radius-sm);
                overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pathbar .btn.small { background: var(--background); }

  /* Notes inside the panes */
  .note { display: grid; grid-template-columns: 18px 1fr; gap: 8px; margin: 8px 10px; padding: 8px 10px; border-radius: var(--rn-radius-md);

                   font-size: 10px; font-weight: 700; background: var(--card); }
  .linklist .sym.success { color: var(--link-success); }
  .linklist .sym.failure { color: var(--link-failure); }
  .linklist .mono { color: var(--foreground); }

  /* Properties (E7) */
  .side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--border); background: var(--background); }
  .side .panel-title { justify-content: space-between; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border); }

  .lastrun { margin: 0 16px 10px; padding: 8px 10px; border-radius: var(--rn-radius-md); font-size: var(--rn-text-xs); }
  .lastrun.failed { background: var(--danger-soft); color: var(--destructive); }

<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme") === "dark" ? "dark" : "light";

  };
  // Icons of the building blocks as in the editor (E13, web/src/components/Icons.tsx).
  const T = {
    "core.start": '<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
    "http.request": '<path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/>',
    "core.check": '<path d="M12 3l9 9-9 9-9-9zM8.5 12l2.5 2.5 4.5-5"/>',
    "db.execute": '<ellipse cx="10" cy="6" rx="6" ry="2.5"/><path d="M4 6v12c0 1.4 2.7 2.5 6 2.5M16 6v4"/><path d="M15 13v8l6-4z"/>',
    "mail.send": '<rect x="3" y="5" width="14" height="11" rx="1.5"/><path d="M3 6.5l7 5 7-5M14 19.5h7.5M18.5 16.5l3 3-3 3"/>',
    "core.log": '<path d="M5 6h14M5 12h14M5 18h9"/>',
  };
  const cat = { "core.start": "allgemein", "http.request": "netzwerk", "core.check": "allgemein", "db.execute": "datenbank",
                "mail.send": "netzwerk", "core.log": "allgemein" };
  const tile = type => `<span class="tile" style="background:var(--rn-kategorie-${cat[type]})">${icon(T[type])}</span>`;

  // ---------- The workflow: workflows/sync-orders.workflow.yaml ----------
  // start → fetch (http.request, paginate) → any (core.check) → save (db.execute, forEach) → notify (mail.send);
  // save → failed (core.log) on failure.
  const failedRun = state === "failed" || state === "skipped";
  const noRun = state === "empty";
  const big = state === "truncated";
  const sel = { output: "fetch", table: "fetch", input: "notify", loop: "save", failed: "save", skipped: "notify",
                empty: "fetch", history: "fetch", truncated: "fetch" }[state];
  const nodes = [
    { id: "start", type: "core.start", x: 16, y: 70, st: "succeeded", d: "0 s" },
    { id: "fetch", type: "http.request", x: 236, y: 70, st: "succeeded", d: big ? "38 s" : "1.8 s" },
    { id: "any", type: "core.check", x: 456, y: 70, st: "succeeded", d: "0 s" },
    { id: "save", type: "db.execute", x: 676, y: 70, st: failedRun ? "failed" : "succeeded", d: failedRun ? "0.4 s" : big ? "3 min 12 s" : "0.6 s", forEach: true },
    { id: "notify", type: "mail.send", x: 896, y: 70, st: failedRun ? "skipped" : "succeeded", d: "1.1 s" },
    { id: "failed", type: "core.log", x: 896, y: 210, st: failedRun ? "succeeded" : "skipped", d: "0 s" },
  ];
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const links = [["start", "fetch", "success"], ["fetch", "any", "success"], ["any", "save", "success"], ["save", "notify", "success"], ["save", "failed", "failure"]];

  // ---------- Explorer ----------
  const rows = [["folder", "connections", 0, "3"], ["db", "erp-sql.yaml", 1, "", "sqlserver"], ["smtp", "mail.yaml", 1, "", "smtp"],
    ["http", "shop-api.yaml", 1, "", "http"], ["folder", "environments", 0, "2"], ["env", "dev.yaml", 1], ["env", "prod.yaml", 1],
    ["folder", "triggers", 0, "1"], ["folder", "workflows", 0, "2"], ["wf", "report.workflow.yaml", 1], ["wf", "sync-orders.workflow.yaml", 1],
    ["proj", "project.yaml", 0]];
  document.getElementById("tree").innerHTML = rows.map(([k, n, d, c, t]) =>
    `<li><div class="row ${d ? "d1" : ""} ${n === "sync-orders.workflow.yaml" ? "selected" : ""}">` +
    (k === "folder" ? (n === "triggers" ? chevRight : chev) : '<span style="width:12px"></span>') +
    `<span class="k">${icon(I[k])}</span>${n}${c ? `<span class="count">${c}</span>` : ""}${t ? `<span class="tag">${t}</span>` : ""}</div></li>`).join("");

  // ---------- Tabs, file bar ----------
  document.getElementById("tabs").innerHTML = `<div class="tab active">${icon(I.wf)} sync-orders.workflow.yaml ×</div>`;
  document.getElementById("filebar").innerHTML = `<span class="crumbs">workflows / <b>sync-orders.workflow.yaml</b></span><div class="spacer"></div>
    <span class="splitbtn"><button class="btn" title="Run with dev (F5)"><span class="play">${icon(I.play, 13)}</span>Run</button><button class="btn" aria-label="Run with other values">${icon(I.down, 13)}</button></span>
    <button class="btn" style="opacity:.5">Save <kbd>Ctrl+S</kbd></button>
    <div class="segmented"><button aria-pressed="true">${icon(I.wf, 14)}Canvas</button><button>${icon(I.code, 14)}YAML</button></div>`;
  if (state === "history") {
    document.getElementById("runinfo").innerHTML = `<div class="runinfo">${icon(I.history, 14)}<span class="st succeeded">✔ Succeeded</span>
      <span>Run <span class="mono">01JDF2W8K4NQ</span> · Today 02:00:00 · 1.9 s · <span class="mono">cron:nightly</span> · prod</span>
      <span class="spacer"></span><button class="icon-btn bordered" aria-label="Older run">${icon(I.left, 13)}</button><button class="icon-btn bordered" aria-label="Newer run">${icon(I.right, 13)}</button>
      <button class="btn small">All runs of this file</button><button class="icon-btn" aria-label="Hide">×</button></div>`;
  }

  // ---------- Canvas ----------
  const W = 190, H = 52, zoom = 0.78;
  let svg = `<svg class="edges" width="1200" height="400">`, labels = "";
  for (const [from, to, type] of links) {
    const a = byId[from], b = byId[to];
    const x1 = a.x + W + 4, y1 = a.y + H / 2, x2 = b.x - 4, y2 = b.y + H / 2;
    let d, mx, my;
    if (y1 === y2) {
      d = `M${x1},${y1} L${x2},${y2}`; mx = x1 + (x2 - x1) * 0.35; my = y1;

      // down to a step below: out to the right, then into the input from the left
      const c = 56;
      d = `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`;
      const t = 0.35, u = 1 - t;

    return `<div class="node ${n.id === sel ? "selected" : ""} ${ran && n.st === "skipped" ? "dim" : ""}" style="left:${n.x}px;top:${n.y}px">

  // ---------- Data of the last run (what the server would keep, E23a) ----------
  const orders = [

    const links = `<div class="links"><a href="#">Show data</a><a href="#">Show in log</a></div>`;
    if (state === "history") last = `<div class="lastrun ok"><b>✔ Succeeded in run 01JDF2W8K4NQ</b> after 1.8 s<div class="links"><a href="#">Show in log</a></div></div>`;
    else if (n.st === "failed") last = `<div class="lastrun failed"><b>✖ Failed in the last run</b> after 0.4 s<div class="err">[7/12] Violation of PRIMARY KEY constraint 'PK_orders'. …</div>${links}</div>`;
    else if (n.st === "skipped") last = `<div class="lastrun skipped"><b>– Skipped in the last run</b><div class="links"><a href="#" style="color:inherit">Why?</a></div></div>`;
    else last = `<div class="lastrun ok"><b>✔ Succeeded in the last run</b> after ${n.d}${links}</div>`;
  }
  const fieldsBy = {
    "http.request": [["Connection", "shop-api", "with.connection"], ["URL", "orders", "with.url"], ["Method", "GET", "with.method"]],
    "mail.send": [["Connection", "mail", "with.connection"], ["To", '<span class="x">${ADMIN_MAIL}</span>', "with.to"],
                  ["Subject", '<span class="x">{{ results.fetch.output.count }}</span>&nbsp;new orders…', "with.subject"]],
    "db.execute": [["For each", '<span class="x">{{ results.fetch.output.items }}</span>', "forEach"], ["Connection", "erp-sql", "with.connection"],
                   ["SQL", "INSERT INTO dbo.orders (id, number, …", "with.sql"]],
  }[n.type];
  document.getElementById("props").innerHTML = `<div class="ph">${tile(n.type)}<div><h3>${title}</h3><div class="t">${n.type}</div></div></div>
    <p class="ph-desc">${desc}</p>${last}
    <div class="field"><label>ID<span class="key">id</span></label><div class="input mono">${sel}</div></div>
    <div class="section"><h4>${chev}Configuration</h4>${fieldsBy.map(([l, v, k]) => `<div class="field"><label>${l}<span class="key">${k}</span></label><div class="input mono">${v}</div></div>`).join("")}</div>
    <div class="section"><h4>${chevRight}Execution<span class="sum">${n.type === "http.request" ? "retry 3 · timeout 2m" : n.type === "db.execute" ? "for each" : "defaults"}</span></h4></div>`;
</script>
</body>
</html>
