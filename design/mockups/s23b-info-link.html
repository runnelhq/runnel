<!doctype html>

  transform that takes it (core.stream-lookup), drawn dotted with the symbol i into a port at

  panel, the counts of a run and the problems of a missing or misplaced info link. Builds on the
  approved mockups E6b, E7, E8 and S25a. Static, design tokens only.

  Query parameters:
    theme = light | dark                                (default light)
    state = canvas | link | run | problems              (default canvas)
    controls = 0                                   hides the mockup control bar (screenshots)
-->

    /* Properties (E7) */

  .list .li small { grid-column: 1 / -1; color: var(--muted-foreground); font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); }

  /* Problems panel below the canvas */
  .bottom { flex: none; border-top: 1px solid var(--border); background: var(--background); }
  .bottom .tabs2 { display: flex; align-items: center; height: 32px; padding: 0 8px; gap: 2px; }
  .bottom .tabs2 .t2 { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--rn-radius-sm);
                       font-size: var(--rn-text-xs); color: var(--muted-foreground); }
  .bottom .tabs2 .t2.active { background: var(--muted); color: var(--foreground); font-weight: 500; }
  .bottom .tabs2 .n { display: inline-grid; place-items: center; min-width: 18px; height: 16px; padding: 0 5px; border-radius: var(--rn-radius-full);
                      font-size: 10px; font-weight: 600; background: var(--danger-soft); color: var(--destructive); }
  .bottom .tabs2 .n.warn { background: var(--warning-soft); color: var(--warning); }
  .bottom .tabs2 .collapse { margin-left: auto; color: var(--muted-foreground); }
  .ptable { border-top: 1px solid var(--border); height: 132px; overflow: auto; font-size: var(--rn-text-xs); }
  .prow { display: grid; grid-template-columns: 20px 1fr 150px 90px; align-items: center; gap: 8px; height: 30px; padding: 0 12px;
          border-bottom: 1px solid var(--border); }
  .prow.sel { background: var(--accent); color: var(--accent-foreground); }
  .prow .sym.err { color: var(--destructive); font-weight: 700; }
  .prow .sym.warn { color: var(--warning); font-weight: 700; }
  .prow .where, .prow .line { font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .prow.sel .where, .prow.sel .line { color: inherit; }
  .phead { color: var(--muted-foreground); font-size: var(--rn-text-2xs); height: 24px; background: var(--muted); }
  .field.flash .input { box-shadow: 0 0 0 3px var(--danger-soft); }

  /* Running (E8) */
  .node .runbar { position: absolute; left: 6px; right: 6px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; }
  .runbar.running { background: var(--status-running); }
  .runbar.succeeded { background: var(--status-success); }
  .runbar.failed { background: var(--status-failed); }
  .runbar.waiting { background: var(--status-waiting); }
  .runbar.cancelled { background: var(--status-skipped); }
  .runbar.skipped { height: 0; border-top: 3px dashed var(--status-skipped); }
  .marker.running { background: var(--status-running); }
  .marker.succeeded { background: var(--status-success); }
  .marker.failed { background: var(--status-failed); }
  .marker.waiting { background: var(--status-waiting); }
  .marker.cancelled, .marker.skipped { background: var(--status-skipped); }
  .marker .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent;
                  border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .node.dim { opacity: .55; }
  .node .type .dur { color: var(--foreground); }
  .edge.flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  .edge.dead { opacity: .3; }
  .edge-label.dead { opacity: .45; }
  @media (prefers-reduced-motion: reduce) { .edge.flow, .marker .spin { animation: none; } }

  .splitbtn { display: inline-flex; }
  .splitbtn .btn:first-child { border-radius: var(--rn-radius-md) 0 0 var(--rn-radius-md); }
  .splitbtn .btn:last-child { border-radius: 0 var(--rn-radius-md) var(--rn-radius-md) 0; border-left: 0; padding: 0 6px; }
  .btn .play { color: var(--status-success); }
  .btn.cancel { color: var(--destructive); border-color: var(--destructive); }
  .runchip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--rn-radius-full);
             font-size: var(--rn-text-2xs); font-weight: 600; white-space: nowrap; }
  .runchip.running { background: color-mix(in srgb, var(--status-running) 14%, transparent); color: var(--status-running); }
  .runchip.succeeded { background: color-mix(in srgb, var(--status-success) 14%, transparent); color: var(--status-success); }
  .runchip.cancelled { background: var(--muted); color: var(--muted-foreground); }
  .runchip .spin { width: 9px; height: 9px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
                   animation: spin .9s linear infinite; }

  .logbar { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 12px; border-top: 1px solid var(--border);
            font-size: var(--rn-text-xs); color: var(--muted-foreground); }
  .logbar .mono { font-size: var(--rn-text-2xs); }
  .logbar .spacer { flex: 1; }
  .log { height: 168px; overflow: auto; border-top: 1px solid var(--border); font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); }
  .lrow { display: grid; grid-template-columns: 88px 52px 104px 1fr; gap: 8px; align-items: center; min-height: 24px; padding: 0 12px; }
  .lrow .t { color: var(--muted-foreground); }
  .lrow .lv { font-weight: 600; }
  .lrow .lv.debug { color: var(--muted-foreground); }
  .lrow .lv.info { color: var(--foreground); }
  .lrow .lv.warn { color: var(--warning); }
  .lrow .lv.error { color: var(--destructive); }
  .lrow.error { background: color-mix(in srgb, var(--danger-soft) 70%, transparent); }
  .lrow .a { color: var(--accent-foreground); background: var(--accent); border-radius: var(--rn-radius-sm); padding: 0 5px;
             justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .a.none { background: none; color: var(--muted-foreground); }
  .lrow.sel { outline: 1px solid var(--ring); outline-offset: -1px; }
  .lastrun { margin: 0 16px 10px; padding: 8px 10px; border-radius: var(--rn-radius-md); font-size: var(--rn-text-xs); }
  .lastrun.failed { background: var(--danger-soft); color: var(--destructive); }
  .lastrun small { display: block; color: var(--muted-foreground); font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); }
  .lastrun a { color: inherit; text-decoration: underline; }
  .dialog .field { padding: 0; }
  .dialog h3 { margin: 16px 0 8px; font-size: var(--rn-text-xs); font-weight: 600; }
  .dialog .btn.primary .play { color: inherit; }
  .dialog h2 .sym.run { background: color-mix(in srgb, var(--status-success) 14%, transparent); color: var(--status-success); }

  /* Pipelines (S25a) */
  .filebar { gap: 8px; }
  .tile.cat-input { background: var(--rn-kategorie-eingabe); }
  .tile.cat-transform, .tile.cat-combine { background: var(--rn-kategorie-transformation); }
  .tile.cat-flow { background: var(--rn-kategorie-fluss); }
  .tile.cat-execution { background: var(--rn-kategorie-ausfuehrung); }
  .tile.cat-output { background: var(--rn-kategorie-ausgabe); }
  .edge.data { stroke: var(--link-always); }
  .edge.error { stroke: var(--link-failure); stroke-dasharray: 7 4; }
  .edge-label.error { color: var(--link-failure); }
  /* Record counts on links after a run (design/README.md 6.1 "Zeilenzähler an Links") */
  .rows { position: absolute; transform: translate(-50%, -50%); height: 20px; padding: 0 7px; display: inline-flex; align-items: center;
          border-radius: var(--rn-radius-full); background: var(--card); border: 1px solid var(--border); box-shadow: var(--rn-shadow-sm);
          font: 600 11px/1 var(--rn-font-mono); font-variant-numeric: tabular-nums; color: var(--foreground); white-space: nowrap; }
  .rows.error { color: var(--link-failure); border-color: var(--link-failure); }
  /* Chips above a node for settings that change how it runs: copies, distribution, forEach */
  .chips { position: absolute; left: -2px; top: -22px; display: flex; gap: 4px; }
  .chips .join { position: static; }
  .node .counts { white-space: nowrap; font-family: var(--rn-font-mono); font-size: var(--rn-text-2xs); color: var(--foreground); font-variant-numeric: tabular-nums; }
  .node .counts .e { color: var(--destructive); }
  /* Stacked look for copies: a second card edge behind the node */
  .node.stack { box-shadow: 5px 5px 0 -1px var(--node), 5px 5px 0 0 var(--node-border), var(--rn-shadow-sm); }
  .port.error-src { border-color: var(--link-failure); }
  /* Fields of a schema (incoming records, records on a link) */
  .fields { margin: 0 16px 12px; border: 1px solid var(--border); border-radius: var(--rn-radius-md); font-size: var(--rn-text-xs); }
  .fields .fr { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-bottom: 1px solid var(--border); }
  .fields .fr:last-child { border-bottom: 0; }
  .fields .fr .n { font-family: var(--rn-font-mono); }
  .fields .fr .ty { font: 10px var(--rn-font-mono); color: var(--muted-foreground); }
  .fields .fr.meta .n { color: var(--muted-foreground); }
  .fields .fr.open { color: var(--muted-foreground); font-style: italic; grid-template-columns: 1fr; }
  .fields .fr.used { background: color-mix(in srgb, var(--accent) 60%, transparent); }
  .input .expr { color: var(--expression); }
  .input .rec { color: var(--foreground); font-weight: 600; }
  .stepper { display: grid; grid-template-columns: 1fr 28px 28px; gap: 0; }
  .stepper .input { border-radius: var(--rn-radius-md) 0 0 var(--rn-radius-md); }
  .stepper button { border: 1px solid var(--input); border-left: 0; background: var(--background); color: var(--muted-foreground); }
  .stepper button:last-child { border-radius: 0 var(--rn-radius-md) var(--rn-radius-md) 0; }
  .help.warn { color: var(--warning); }
  .input.warning { border-color: var(--warning); outline: 2px solid var(--warning-soft); }
  .kv { margin: 0 16px 12px; }
  .kv .kvr { display: grid; grid-template-columns: 96px 1fr 24px; gap: 6px; margin-bottom: 6px; }
  .kv .kvr .x { display: grid; place-items: center; color: var(--muted-foreground); }
  .kv .add { display: inline-flex; align-items: center; gap: 6px; font-size: var(--rn-text-xs); color: var(--primary); }
  .lastrun.ok { background: color-mix(in srgb, var(--status-success) 12%, transparent); color: var(--status-success); }
  .lastrun .cnt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; color: var(--foreground); }
  .lastrun .cnt div { font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .lastrun .cnt b { display: block; font: 600 var(--rn-text-sm) var(--rn-font-mono); color: var(--foreground); font-variant-numeric: tabular-nums; }
  .lastrun .cnt b.e { color: var(--destructive); }

  .mock-controls { height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
                   font: 12px/1 var(--rn-font-mono); background: var(--rn-tiefe-950); color: var(--rn-tiefe-300); }
  .mock-controls a { color: var(--rn-strom-300); }
  .mock-controls b { color: var(--rn-tiefe-0); }

  /* Info links (S23b): line form and symbol tell them apart, the colour stays that of data links */
  .edge.info { stroke: var(--link-always); stroke-dasharray: 1 5; stroke-linecap: round; stroke-width: 2.5; }
  .edge.info.bad { stroke: var(--link-failure); }
  .edge-label.info { color: var(--link-always); }
  .edge-label.info.bad { color: var(--link-failure); }
  .rows.info { border-style: dotted; border-color: var(--link-always); }
  /* The port for the info link: top middle, only on transforms that take one */
  .port.info-in { top: -5px; left: 50%; margin: 0 0 0 -5px; width: 10px; height: 10px; border-radius: 3px;
                  border: 1.5px dotted var(--link-always); }
  .port.info-in.missing { border: 1.5px solid var(--destructive); background: var(--danger-soft); }
  .port.info-in.target { width: 16px; height: 16px; margin-left: -8px; top: -8px; border: 2px solid var(--node-selected); background: var(--accent); }
  .wait { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); white-space: nowrap; padding: 0 6px; height: 18px;
          display: inline-flex; align-items: center; gap: 4px; border-radius: var(--rn-radius-sm); border: 1px dotted var(--link-always);
          background: var(--card); font: 500 10px/1 var(--rn-font-mono); color: var(--muted-foreground); }
  .menu .mi.off { color: var(--muted-foreground); }
  .menu .mi.off .sym { opacity: .5; }
  .menu .mi small { display: block; font-size: 10px; color: var(--muted-foreground); line-height: 1.2; }
  .menu.wide { width: 252px; }
  .menu .mi.two { height: auto; padding: 5px 8px; align-items: flex-start; }
  .menu .mi.two .sym { margin-top: 2px; }

  .fields .fh { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; background: var(--muted);
                font-size: var(--rn-text-2xs); color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
  .fields .fh .sym { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 1px dotted currentColor;
                     font: 700 9px var(--rn-font-mono); }
  .pair { display: grid; grid-template-columns: 1fr 14px 1fr 20px; gap: 6px; align-items: center; margin: 0 16px 6px; }
  .pair .eq { text-align: center; color: var(--muted-foreground); }
  .pair .x { color: var(--muted-foreground); text-align: center; }
  .pair-head { display: grid; grid-template-columns: 1fr 14px 1fr 20px; gap: 6px; margin: 0 16px 4px; font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .ret { display: grid; grid-template-columns: 1fr 1fr 72px 20px; gap: 6px; align-items: center; margin: 0 16px 6px; }
  .ret-head { display: grid; grid-template-columns: 1fr 1fr 72px 20px; gap: 6px; margin: 0 16px 4px; font-size: var(--rn-text-2xs); color: var(--muted-foreground); }
  .ret .x { color: var(--muted-foreground); text-align: center; }
  .add-line { margin: 0 16px 12px; display: inline-flex; align-items: center; gap: 6px; font-size: var(--rn-text-xs); color: var(--primary); }
  .lsource { margin: 0 16px 12px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px dotted var(--link-always);
            border-radius: var(--rn-radius-md); font-size: var(--rn-text-xs); }
  .lsource .sym { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px dotted currentColor;
                 font: 700 10px var(--rn-font-mono); color: var(--link-always); flex: none; }
  .lsource small { display: block; color: var(--muted-foreground); font-size: var(--rn-text-2xs); }
  .lsource.missing { border: 1px solid var(--destructive); background: var(--danger-soft); color: var(--destructive); }
  .lsource.missing .sym { color: var(--destructive); border-style: solid; }
  .node .type { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lastrun .cnt.four { grid-template-columns: repeat(4, 1fr); }
  .input.invalid-soft { border-color: var(--warning); outline: 2px solid var(--warning-soft); }
</style>
</head>

    <div class="spacer"></div>
    <div class="segmented">
      <button aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>System</button>
      <button><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Light</button>
      <button><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Dark</button>

<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme") === "dark" ? "dark" : "light";
  const state = params.get("state") || "canvas";
  document.documentElement.dataset.theme = theme;
  if (params.get("controls") === "0") document.getElementById("mock").remove();
  else {
    document.getElementById("app").classList.add("with-controls");
    document.querySelectorAll("[data-theme]").forEach(a => a.href = `?theme=${a.dataset.theme}&state=${state}`);
    document.querySelectorAll("[data-state]").forEach(a => a.href = `?theme=${theme}&state=${a.dataset.state}`);
  }

  const icon = (d, size = 16) => `<svg class="i" viewBox="0 0 24 24" style="width:${size}px;height:${size}px">${d}</svg>`;
  const chev = '<svg class="i chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
  const chevRight = '<svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  const down = icon('<path d="M6 9l6 6 6-6"/>', 14);
  const play = '<path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/>';
  const icons = {
    "csv.input": '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
    "csv.output": '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M12 11v7M9 15l3 3 3-3"/>',
    "core.stream-lookup": '<circle cx="10" cy="10" r="5"/><path d="M14 14l6 6"/><path d="M8 10h4"/>',
    "db.lookup": '<ellipse cx="10" cy="6" rx="6" ry="2.5"/><path d="M4 6v8c0 1.4 2.7 2.5 6 2.5M16 6v4"/><circle cx="17" cy="16" r="3"/><path d="M19.2 18.2L21 20"/>',
    "core.log": '<path d="M5 6h14M5 12h14M5 18h9"/>',
    "core.sort": '<path d="M7 4v16M4 17l3 3 3-3M14 6h6M14 12h4M14 18h2"/>',
    "core.group-by": '<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><path d="M7.5 11v4h9v-4M12 15v5"/>',
    "core.dedupe": '<rect x="4" y="4" width="10" height="10" rx="1"/><path d="M10 18h8a2 2 0 0 0 2-2V8"/>',
  };
  const category = { "csv.input": "input", "csv.output": "output", "core.log": "output",
    "core.stream-lookup": "combine", "db.lookup": "combine", "core.sort": "combine", "core.group-by": "combine", "core.dedupe": "combine" };

  // Explorer: the project examples/pipelines with the new pipeline orders-enrich.
  const kind = {
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    pl: '<path d="M3 7h5l3 5-3 5H3"/><path d="M11 12h10M17 8l4 4-4 4"/>',
    proj: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
  };
  const file = "orders-enrich.pipeline.yaml";
  const files = [["folder", "data", 0, "3"], ["folder", "pipelines", 0, "5"],
                 ["pl", "customers.pipeline.yaml", 1], ["pl", "daily.pipeline.yaml", 1], ["pl", file, 1],
                 ["pl", "orders.pipeline.yaml", 1], ["pl", "total.pipeline.yaml", 1], ["folder", "workflows", 0, "3"], ["proj", "project.yaml", 0]];
  document.getElementById("tree").innerHTML = files.map(([k, n, d, c]) =>
    `<li><div class="row ${d ? "d1" : ""} ${n === file ? "selected" : ""}">` +
    (k === "folder" ? (n === "pipelines" ? chev : chevRight) : `<span style="width:12px"></span>`) +
    `<span class="k">${icon(kind[k])}</span>${n}${c ? `<span class="count">${c}</span>` : ""}</div></li>`).join("");

  // Palette: the group Combine with the new transform.
  document.getElementById("search").placeholder = "Search transforms";
  const groups = [
    ["Input", [], false], ["Transform", [], false], ["Flow", [], false], ["Execution", [], false],
    ["Combine", [["db.lookup", "Database Lookup"], ["core.group-by", "Group By"], ["core.dedupe", "Remove Duplicates"], ["core.sort", "Sort"], ["core.stream-lookup", "Stream Lookup"]], true],
    ["Output", [], false],
  ];
  const groupCount = { Input: 4, Transform: 8, Flow: 2, Execution: 2, Output: 6 };
  document.getElementById("palette").innerHTML = groups.map(([g, items, open]) =>
    `<div class="group">${open ? chev : chevRight}${g}<span class="count">${items.length || groupCount[g]}</span></div>` +
    (open ? `<ul class="items">${items.map(([t, label]) => `<li class="item"><span class="tile cat-${category[t]}">${icon(icons[t])}</span><span class="t">${label}<small>${t}</small></span></li>`).join("")}</ul>` : "")).join("") +
    `<p class="palette-hint">Stream Lookup takes its lookup data over an info link at the top of the node.</p>`;

  document.getElementById("tabs").innerHTML = `<div class="tab active">${icon(kind.pl)} ${file} ${state === "link" ? '<span class="dirty">●</span>' : "×"}</div>`;
  const problems = state === "problems";
  document.getElementById("filebar").innerHTML = `
    <span class="crumbs" title="pipelines/${file}"><b>${file}</b></span>
    <button class="icon-btn" style="border:0;width:22px;height:22px" title="Copy path" aria-label="Copy path">${icon('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>', 13)}</button>
    ${problems ? `<span class="badge err" title="2 errors, 1 warning">✖ 2 · ⚠ 1</span>` : ""}
    <div class="spacer"></div>
    <span class="splitbtn"><button class="btn" title="Run with dev (F5)"><span class="play">${icon(play, 14)}</span>Run</button>
      <button class="btn" title="Run with other values…" aria-label="Run with other values">${down}</button></span>
    <div class="group">
      <button class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo" ${state === "link" ? "" : "disabled"}>${icon('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>', 14)}</button>
      <button class="icon-btn" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>${icon('<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>', 14)}</button>
    </div>
    <button class="btn primary" title="Save (Ctrl+S)" ${state === "link" ? "" : 'style="opacity:.5"'}>${icon('<path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3M7 21v-7h10v7"/>', 14)}Save</button>
    <div class="segmented" role="group" aria-label="View">
      <button aria-pressed="true">${icon(kind.pl, 14)}Canvas</button>
      <button aria-pressed="false">${icon('<path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/>', 14)}YAML</button>
    </div>`;

  // The graph: orders get the name and region of their customer from customers.csv.
  const nodes = [
    { id: "customers", type: "csv.input", x: 40, y: 40 },
    { id: "orders", type: "csv.input", x: 40, y: 250 },
    { id: "lookup", type: "core.stream-lookup", x: 330, y: 250, info: true },
    { id: "write", type: "csv.output", x: 620, y: 250 },
    { id: "unknown", type: "core.log", x: 620, y: 430 },
  ];
  // [from, to, type]; info links end at the top of the target.
  let edges = [["orders", "lookup", "data"], ["customers", "lookup", "info"], ["lookup", "write", "data"], ["lookup", "unknown", "error"]];
  if (problems) edges = [["orders", "lookup", "data"], ["customers", "write", "info"], ["lookup", "write", "data"], ["lookup", "unknown", "error"]];
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  if (state === "canvas") byId.lookup.selected = true;
  if (state === "run") byId.lookup.selected = true;
  if (problems) { byId.lookup.problem = "err"; byId.write.problem = "err"; byId.lookup.selected = true; byId.lookup.missing = true; }
  const linkSel = state === "link" ? "customers>lookup" : "";
  const counts = state === "run" ? { customers: [0, 1000, 0], orders: [0, 3, 0], lookup: [3, 2, 1], write: [2, 2, 0], unknown: [1, 1, 0] } : {};
  const linkRows = state === "run" ? { "customers>lookup": 1000, "orders>lookup": 3, "lookup>write": 2, "lookup>unknown": 1 } : {};

  const canvas = document.getElementById("canvas");
  const W = 176, H = 52, zoom = 0.82;
  const stage = document.createElement("div");
  stage.className = "stage";
  stage.style.transform = `translate(16px, 36px) scale(${zoom})`;
  let svg = `<svg class="edges" width="1200" height="700">`, labels = "";
  const bez = (x1, y1, x2, y2) => {
    const dx = Math.max(40, (x2 - x1) / 2);
    const d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
    const t = 0.35, u = 1 - t;
    return [d, u*u*u*x1 + 3*u*u*t*(x1 + dx) + 3*u*t*t*(x2 - dx) + t*t*t*x2, u*u*u*y1 + 3*u*u*t*y1 + 3*u*t*t*y2 + t*t*t*y2];
  };
  for (const [from, to, type] of edges) {
    const a = byId[from], b = byId[to], key = `${from}>${to}`;
    let d, mx, my;
    const x1 = a.x + W + 4, y1 = a.y + H / 2;
    if (type === "info") {
      // Out to the right, then down into the port at the top middle of the target.
      const x2 = b.x + W / 2, y2 = b.y - 6;
      d = `M${x1},${y1} C${x2},${y1} ${x2},${y1} ${x2},${y2}`;
      const t = 0.35, u = 1 - t;
      mx = u*u*u*x1 + 3*u*u*t*x2 + 3*u*t*t*x2 + t*t*t*x2; my = u*u*u*y1 + 3*u*u*t*y1 + 3*u*t*t*y1 + t*t*t*y2;
    } else if (b.y > a.y + 40 && b.x > a.x + W) {
      [d, mx, my] = bez(x1, y1, b.x - 4, b.y + H / 2);
    } else {
      [d, mx, my] = bez(x1, y1, b.x - 4, b.y + H / 2);
    }
    const sel = key === linkSel ? "selected" : "";
    const bad = problems && type === "info" ? "bad" : "";
    svg += `<path class="edge ${type} ${sel} ${bad}" d="${d}"/>`;
    if (type === "error") labels += `<span class="edge-label error" style="left:${mx}px;top:${my}px">✖</span>`;
    if (type === "info") labels += `<span class="edge-label info ${sel} ${bad}" style="left:${mx}px;top:${my}px" title="Info link: lookup data">i</span>`;
    if (linkRows[key] !== undefined) {
      const rx = type === "data" ? (x1 + b.x) / 2 : mx, ry = type === "data" ? (y1 + b.y + H / 2) / 2 : my + 30;
      labels += `<span class="rows ${type === "error" ? "error" : type === "info" ? "info" : ""}" style="left:${rx}px;top:${ry}px" title="${linkRows[key]} records">${linkRows[key].toLocaleString("en-US")}</span>`;
    }
  }
  svg += `</svg>`;
  stage.innerHTML = svg + labels + nodes.map(n => {
    const c = counts[n.id];
    const sub = c ? `<div class="counts" title="read ${c[0]}, written ${c[1]}, errors ${c[2]}">${n.type === "csv.input" ? "" : `${c[0]} → `}${c[1].toLocaleString("en-US")}${c[2] ? ` · <span class="e">✖ ${c[2]}</span>` : ""}</div>`
                  : `<div class="type">${n.type}</div>`;
    const marker = c ? `<span class="marker succeeded" title="succeeded">✔</span>`
      : n.problem === "err" ? `<span class="marker err" title="1 error">✖</span>` : "";
    const infoPort = n.info ? `<span class="port info-in ${n.missing ? "missing" : ""} ${state === "link" ? "target" : ""}" title="Info link: lookup data"></span>` : "";
    return `
    <div class="node ${n.selected ? "selected" : ""} ${n.problem === "err" ? "has-error" : ""}" style="left:${n.x}px;top:${n.y}px">
      ${n.type === "csv.input" ? "" : `<span class="port in"></span>`}
      ${infoPort}
      <span class="tile cat-${category[n.type]}">${icon(icons[n.type])}</span>
      <span class="text"><div class="id">${n.id}</div>${sub}</span>
      <span class="port out ${n.id === "customers" && state === "link" ? "source" : ""}"></span>
      ${c ? `<span class="runbar succeeded"></span>` : ""}
      ${marker}
    </div>`;
  }).join("");
  canvas.append(stage);
  canvas.insertAdjacentHTML("beforeend", `<div class="controls-panel">
      <button title="Zoom in">${icon('<path d="M12 5v14M5 12h14"/>', 14)}</button>
      <button title="Zoom out">${icon('<path d="M5 12h14"/>', 14)}</button>
      <button title="Fit to view">${icon('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>', 14)}</button>
    </div><span class="zoom">${Math.round(zoom * 100)} %</span>`);
  const at = (x, y) => `left:${16 + x * zoom}px;top:${36 + y * zoom}px`;
  if (state === "link") {
    // The link menu of E6b: "Info" only for targets that take lookup data.
    canvas.insertAdjacentHTML("beforeend", `<div class="menu wide" style="${at(40, 112)}">
      <div class="mi"><span class="sym" style="color:var(--link-always)">→</span>Data<span class="k">D</span></div>
      <div class="mi active two"><span class="sym" style="color:var(--link-always);border-style:dotted">i</span><span>Info<small>Lookup data for lookup, read first</small></span><span class="k">I</span></div>
      <div class="mi"><span class="sym" style="color:var(--link-failure)">✖</span>Error<span class="k">E</span></div>
      <hr><div class="mi danger">Delete link<span class="k">Del</span></div></div>`);
    canvas.insertAdjacentHTML("beforeend", `<span class="hint">${icon('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>', 14)}A link dropped on the top of a lookup becomes an info link</span>`);
  }
  if (problems) {
    const b = byId.lookup;
    canvas.insertAdjacentHTML("beforeend", `<div class="popover" style="${at(70, b.y + H + 30)}">
      <h4>lookup · 1 error</h4>
      <div class="problem"><span class="sym err">✖</span><span>core.stream-lookup needs an info link with the lookup data: drag a link from the transform with the data to the top of lookup</span></div></div>`);
  }

  // Status bar
  document.getElementById("status").innerHTML =
    `<span class="ok">● Connected</span><span class="mono" style="font-size:11px">127.0.0.1:7300</span>` +
    `<span>Pipeline · 5 transforms · 4 links</span>` +
    (state === "run" ? `<span style="color:var(--status-success)">✔ Last run succeeded · 6 ms</span>` : "") +
    (state === "link" ? `<span class="dirty">● Unsaved changes</span>` : "") +
    `<span class="spacer"></span><span>Runnel v0.1.0</span>`;

  // Below the canvas: Problems | Log
  const bottom = document.getElementById("bottom");
  if (state === "run") {
    const logs = [
      ["10:14:02.101", "info", "", 'pipeline "orders-enrich" started (environment dev)'],
      ["10:14:02.101", "debug", "lookup", "waiting for the lookup data from customers (info link)"],
      ["10:14:02.104", "info", "customers", "read 1,000 rows from data/customers.csv"],
      ["10:14:02.105", "info", "lookup", "loaded 1,000 lookup records from customers (999 keys)"],
      ["10:14:02.106", "info", "lookup", "looked up 3 records: 2 found, 1 not found"],
      ["10:14:02.106", "info", "write", "wrote 2 rows to out/orders-enriched.csv"],
      ["10:14:02.107", "info", "", 'pipeline "orders-enrich" succeeded in 6 ms'],
    ];
    bottom.innerHTML = `<div class="tabs2"><span class="t2">${chevRight}Problems</span><span class="t2 active">${chev}Log</span></div>
      <div class="logbar"><span class="runchip succeeded">✔ Succeeded · 6 ms</span><span class="mono">01M85A2QJX · orders-enrich · dev</span>
        <span class="spacer"></span><label class="check" style="font-size:var(--rn-text-xs)"><span class="box on">✔</span>Debug</label></div>
      <div class="log" role="log" aria-label="Run log">${logs.map(([t, lv, a, m]) => `<div class="lrow">
        <span class="t">${t}</span><span class="lv ${lv}">${lv.toUpperCase()}</span><span class="a ${a ? "" : "none"}">${a || "—"}</span><span>${m}</span></div>`).join("")}</div>`;
  } else if (problems) {
    bottom.innerHTML = `<div class="tabs2"><span class="t2 active">${chev}Problems <span class="n">2</span><span class="n warn">1</span></span><span class="t2">${chevRight}Log</span></div>
      <div class="ptable">
        <div class="prow phead"><span></span><span>Message</span><span>Where</span><span>Line</span></div>
        <div class="prow sel"><span class="sym err">✖</span><span>transform "lookup": core.stream-lookup needs an info link with the lookup data</span><span class="where">lookup</span><span class="line">14:5</span></div>
        <div class="prow"><span class="sym err">✖</span><span>link #2 (customers → write): csv.output takes no info link; only lookups do (core.stream-lookup)</span><span class="where">links[1].type</span><span class="line">31:37</span></div>
        <div class="prow"><span class="sym warn">⚠</span><span>field "id" of the lookup data is not known: there is no info link yet</span><span class="where">lookup · with.keys[0].lookupField</span><span class="line">18:24</span></div>
      </div>`;
  } else {
    bottom.innerHTML = `<div class="tabs2"><span class="t2">${chevRight}Problems</span><span class="t2">${chevRight}Log</span></div>`;
  }

  // Properties panel
  const props = document.getElementById("props");
  const field = (label, body, key, help, cls = "") => `<div class="field ${cls}"><label>${label}<span class="key">${key}</span></label>${body}${help ? `<div class="help ${cls}">${help}</div>` : ""}</div>`;
  const input = (value, cls = "", ph = false) => `<div class="input ${cls} ${ph ? "placeholder" : ""}">${value}</div>`;
  const head = (type, title, desc) => `<div class="ph"><span class="tile cat-${category[type]}">${icon(icons[type])}</span>
      <div><h3>${title}</h3><div class="t">${type}</div></div></div><p class="ph-desc">${desc}</p>`;
  const sel = (v, cls = "") => `<div class="input select mono ${cls}">${v}${down}</div>`;
  const fieldList = (groups) => `<div class="fields">${groups.map(([title, info, rows]) =>
      `<div class="fh">${info ? '<span class="sym">i</span>' : "→"} ${title}</div>` +
      rows.map(([n, t, cls]) => `<div class="fr ${cls ?? ""}"><span class="n">${n}</span><span class="ty">${t}</span></div>`).join("")).join("")}</div>`;

  const lookupPanel = () => {
    const missing = problems;
    return head("core.stream-lookup", "Stream Lookup", "Adds the fields of the matching lookup record to each record; the lookup data comes over an info link") +
      (state === "run" ? `<div class="lastrun ok"><b>✔ Succeeded in the last run</b> · 1 ms
        <div class="cnt four"><div><b>1,000</b>lookup records</div><div><b>3</b>read</div><div><b>2</b>written</div><div><b class="e">✖ 1</b>to the error link</div></div>
        <small>10:14:02 · <a href="#">Show in log</a></small></div>` : "") +
      field("ID", input("lookup"), "id") +
      `<div class="section"><h4>${chev}Lookup data</h4>` +
      (missing
        ? `<div class="lsource missing"><span class="sym">i</span><span><b>No info link</b><small>Drag a link from the transform with the data to the top of lookup</small></span></div>`
        : `<div class="lsource"><span class="sym">i</span><span>from <b>customers</b> · info link<small>Read completely before the first record of orders is looked up</small></span></div>`) +
      field("Most lookup records", `<div class="stepper"><div class="input mono">100000</div><button aria-label="Fewer">−</button><button aria-label="More">+</button></div>`, "with.maxRecords",
            "More records stop the pipeline; for larger tables use Database Lookup") + `</div>` +
      `<div class="section"><h4>${chev}Configuration</h4>` +
      `<div class="field" style="margin-bottom:4px"><label>Keys<span class="req">*</span><span class="key">with.keys</span></label></div>
       <div class="pair-head"><span>Field</span><span></span><span>Lookup field</span><span></span></div>
       <div class="pair"><div class="input select mono">customerId${down}</div><span class="eq">=</span>${sel("id", missing ? "invalid-soft" : "")}<span class="x">×</span></div>
       ${missing ? `<div class="help warn" style="margin:0 16px 8px">⚠ field "id" of the lookup data is not known: there is no info link yet</div>` : ""}
       <span class="add-line">+ Add key</span>` +
      `<div class="field" style="margin-bottom:4px"><label>Return<span class="req">*</span><span class="key">with.return</span></label></div>
       <div class="ret-head"><span>Lookup field</span><span>As</span><span>Default</span><span></span></div>
       <div class="ret">${sel("name")}<div class="input mono">customerName</div><div class="input mono placeholder">empty</div><span class="x">×</span></div>
       <div class="ret">${sel("region")}<div class="input mono placeholder">region</div><div class="input mono">n/a</div><span class="x">×</span></div>
       <span class="add-line">+ Add field</span>` +
      field("Without a match", `<div class="seg"><button aria-pressed="false">Keep</button><button aria-pressed="false">Drop</button><button aria-pressed="true"><span class="sym" style="color:var(--link-failure)">✖</span> Error</button></div>`, "with.notFound",
            "Error: the record goes to the error link (unknown)") +
      field("Several matches", `<div class="seg"><button aria-pressed="true">First</button><button aria-pressed="false"><span class="sym" style="color:var(--link-failure)">✖</span> Error</button></div>`, "with.multiple",
            "First: the first lookup record in the order they arrived") + `</div>` +
      `<div class="section"><h4>${chev}Incoming fields</h4>` +
      fieldList([["from orders", false, [["orderId", "int"], ["customerId", "int", "used"], ["amount", "decimal"]]],
                 ["lookup data from customers", true, missing ? [] : [["id", "int", "used"], ["name", "string", "used"], ["region", "string", "used"]]]]) +
      (missing ? `<p class="note">The lookup fields are known once an info link leads to lookup.</p>` : "") + `</div>`;
  };

  if (state === "link") {
    props.innerHTML = `<div class="ph"><span class="tile" style="background:var(--link-always)">${icon('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>')}</span>
        <div><h3>Link</h3><div class="t">customers → lookup</div></div></div>
      <p class="ph-desc">Lookup data: lookup reads all records of <b>customers</b> before it looks up the first record of orders.</p>` +
      field("Type", `<div class="seg"><button aria-pressed="false"><span class="sym" style="color:var(--link-always)">→</span>Data</button><button aria-pressed="true"><span class="sym" style="color:var(--link-always)">i</span>Info</button><button aria-pressed="false"><span class="sym" style="color:var(--link-failure)">✖</span>Error</button></div>`, "type",
            "Info is offered for transforms that take lookup data (core.stream-lookup); one info link each") +
      `<div class="section"><h4>${chev}Fields on this link<span class="sum">from customers.csv</span></h4>` +
      fieldList([["lookup data", true, [["id", "int"], ["name", "string"], ["region", "string"], ["since", "date"]]]]) +
      `<p class="note">These fields are offered as <b>Lookup field</b> in the properties of lookup.</p></div>`;
  } else {
    props.innerHTML = lookupPanel();
  }
</script>
</body>
</html>
