version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars

  settings:
    gosec:
      excludes:
        # Runnel reads and writes the files a workflow names (paths from the project and
        # its variables); the folders it creates are meant for the user, like any tool.
        - G301 # permissions of new folders
        - G302 # permissions of opened files
        - G304 # file paths from variables
        - G306 # permissions of written files
  exclusions:
    rules:
      # Tests use fixed paths, plain HTTP calls and odd keys on purpose.
      - path: _test\.go
        linters: [bodyclose, gosec, noctx]
      - path: _test\.go
        text: "mapKey:"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/runnelhq/runnel
